# 第 12 章　合成数据与蒸馏（Synthetic Data & Distillation）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 143–158 页。

来自*人类反馈*的强化学习，深植于一个理念：让人类的影响力持续存在于我们所打造的模型之中。当第一批模型成功以 RLHF 训练完成时，人类数据是以这种方式改进模型的*唯一*可行途径。

当时，只有人类能为训练撰写出质量够高的问题回复；也只有人类能搜集可靠且具体的反馈数据来训练奖励模型。

随着 AI 模型愈来愈强，这个假设迅速瓦解。合成数据远比人类数据便宜、也更容易迭代，它的出现降低了实验与研究的成本，促成了 RLHF 的普及。这也使得 RLHF 成为更广义的「后训练」（post-training）模型塑造方法中，最早受到关注的核心。本章将概略介绍合成数据如何、以及为何正在取代或扩充 RLHF 流程中的许多环节。

## 12.1 合成数据的角色（The Roles of Synthetic Data）

对合成数据常见的批评之一是**模型崩溃**（model collapse）——指反复在模型自身的生成内容上训练，会逐渐窄化有效的训练分布 [270]。随着多样性下降，罕见的事实与风格会被低估，小错误也可能在多次迭代中被放大，导致泛化能力变差。实际应用中，这些失败大多与「在未经过滤、重复、单一模型的输出上自我训练」有关；混入真实／人类数据、使用多样的教师模型、去重复，以及严格的质量过滤，大致就能避开崩溃的情境。就今日前沿实验室的训练流程而言，证据显示合成数据可以、也应该被大规模使用，而不会出现崩溃论最强版本所暗示的灾难性退化 [271] [272]。

领先的模型**需要合成数据**才能达到最佳性能。现代后训练中的合成数据涵盖训练的许多环节——语言模型被用来从种子范例生成新的训练提示 [273]、修改既有提示、为提示生成完成（completion）[274]、提供 AI 反馈以建立偏好数据 [28]、过滤完成 [275]，以及更多其他用途。合成数据是后训练的关键。

合成数据能发挥到这种程度的影响力，是从 GPT-4 等级的模型才开始的。在早期语言模型（如 Llama 2 与 GPT-3.5-Turbo）的时代，模型在生成或监督数据流程方面还不够可靠。在一到两年之内，语言模型生成答案的能力就远远超越了人类。在从 GPT-3.5 过渡到 GPT-4 等级模型的过程中，模型执行 LLM 评审（LLM-as-a-judge）任务的能力也随之浮现。GPT-4 或更好的模型在对一段内容生成反馈或评分时，稳健性与一致性都高出许多。

自 2022 年底 ChatGPT 问世以来的这些年间，我们见到许多具有影响力的合成数据集。其中包括：UltraFeedback [28]，第一个著名的合成偏好数据集，打开了 DPO 革命；Stanford Alpaca，2023 年最早的聊天式微调数据集之一；Tülu 3 [6] 中聚焦特定技能（例如数学、程序、指令遵循）的合成数据集；以及 OpenThoughts 3 和 2025 年许多其他用于训练思考模型的合成推理数据集 [173]。今日要入门业界等级后训练的多数经典参考数据，都涉及上述的 Tülu 3 或 OpenThoughts 3 之类的数据集，而快速入门指南往往从较小、较简单的数据集（如 Alpaca）着手，因为训练速度快得多。

另一项重大变化与数据集规模有关：微调数据集的提示数量不断成长——Alpaca 是 5.2 万笔，OpenThoughts 与 Tülu 3 则是百万笔以上——回复的长度也在增加。更长的回复与更多的提示，使得 Alpaca 数据集约在 1,000 万训练 token 之谱，Tülu 大约大 50 倍、约 5 亿 token，OpenThoughts 3 更大，约在 100 亿 token 之谱。

在这段转变过程中，合成数据并非在整条流程中均匀地取代人类数据。就**指令数据（SFT）**而言，合成生成已大致胜出——如今从更强模型蒸馏而得的完成，质量高于大多数人类写作者在规模化情境下所能提供的（在最困难的前沿推理问题上有些例外）。就 **RLHF 的偏好数据**而言，情况比较分歧：学术研究显示合成偏好数据表现相当，但前沿实验室仍将人类偏好数据视为竞争护城河。就**评测**而言，分工又是另一种样貌：LLM 评审让模型输出的*评分*得以低成本规模化，但底层的基准测试与标准答案标签仍需由人类建立。整体模式是：在模型可靠度超越人类之处，合成数据占据主导；而在能力前沿、建立标准答案，以及引导训练方面，人类仍不可或缺。

## 12.2 以合成数据进行蒸馏（Distillation with Synthetic Data）

在关于合成数据在语言模型中角色的讨论里，「蒸馏」（distillation）一直是最有力的说法。蒸馏一词源自深度学习文献中师生知识蒸馏（teacher-student Knowledge Distillation, KD）的技术定义 [276]。

![图](../webapp/assets/figures/fig-p144-1.png)
*图 36：传统知识蒸馏以 KL 散度损失训练较小的学生模型，去匹配较大教师模型的软概率分布。两个模型同时处理相同的输入，而温度缩放（$\tau > 1$）会使分布变得平滑，以揭露更多类别之间关系的信息。*

蒸馏在口语上则泛指使用较强模型的输出来训练较小的模型。

![图](../webapp/assets/figures/fig-p145-1.png)
*（示意图：提示 $\{x_i\}$ 输入强模型（例如 GPT-4）产生完成 $\{y_i\}$，两者构成用于训练较小模型的合成数据集 $\{(x_i, y_i)\}$。）*

在后训练中，这种广义的蒸馏概念通常有两种形式：

1. 作为横跨后训练流程各环节的数据引擎：为指令生成完成、偏好数据（或宪法式 AI（Constitutional AI）），或 RL 的验证。
2. 将特定技能从较强模型转移到较弱模型，这通常用于数学推理或程序撰写等特定技能。

第一种策略随着语言模型的演进而日益流行，因为在各式任务上，模型撰写答案已比人类更可靠。GPT-4 等级的模型将其范畴扩大到：针对数学与程序等复杂任务蒸馏更强的模型（如前所述）。在这里，蒸馏促成了一种模型软件包（model suite）的作法：实验室往往会训练一个大型的内部模型，例如 Claude Opus 或 Gemini Ultra，不对外发布，只在内部用来让较强的模型变得更好。在开放模型的世界，常见作法是将封闭 API 模型的训练数据蒸馏到较小、公开发布权重的模型中 [26]。在此之中，策划高质量的提示并过滤教师模型的回复，是性能最大化的关键。

将特定技能转移到较小的语言模型，使用的是同样的蒸馏原理——取得可用于训练的最佳数据。这方面已有许多论文研究如何使用来自较强模型的有限数据集，来改进对齐 [14]、数学推理 [277] [278]，以及测试时扩展（test-time scaling）[158]。

本章其余部分的合成数据方法，都是把语言模型输出直接用于训练流程之中的各种数据配方。

## 12.3 迈向 on-policy 师生蒸馏（The Path to On-Policy, Teacher-Student Distillation）

虽然广义的蒸馏已成为语言模型后训练的标准作法，但随着后训练配方转向推理与代理式（agentic）模型，「师生知识蒸馏」这个特定子领域重新受到关注。以新形式知识蒸馏训练的领先模型包括阿里巴巴的 Qwen3 [60]、小米的 MiMo-V2-Flash [184]、智谱 AI 的 GLM-5 [279]，以及 DeepSeek-V4-Pro [280]。

蒸馏之所以放在本章，是因为现代后训练中许多合成数据的用法，实际应用中就是受蒸馏启发的流程：由较强的模型产生标签、完成、logits、评语或其他监督信号，再以这些信号训练学生模型。与此同时，蒸馏的技术文献正逐渐发展为自成一格的后训练方法，特别是随着 on-policy 与自我蒸馏（self-distillation）配方日益普及。目前我们把它视为合成数据工具箱的一部分来介绍，但本书未来的版本或许值得为蒸馏另辟专章，作为与指令微调、强化学习等并列的训练工具。

### 12.3.1 将知识蒸馏调整至语言模型（Adapting Knowledge-Distillation for LMs）

最初的文献引入知识蒸馏，是特别作为一种从已训练完成、更强及／或更大的*教师*网络训练*学生*模型的方法 [276]。KD 的特点是使用*软*训练标签，而非标准目标函数（例如以交叉熵损失做下一个 token 预测）所用的 one-hot 标签。基于软标签的目标函数关注所有可能的下一个 token 或预测的完整分布，而不只是单一预测 token 是否正确，并训练学生分布去匹配教师分布。

KD 原则上可以套用于任何深度学习问题，例如对输入预测单一类别。若要将它特别套用到自回归式的语言模型，可以把损失分解成逐 token 的分布匹配损失。2016 年，Kim 与 Rush 将 KD 应用于让学生模型从教师模型生成的*序列*中学习 [281]。

令 $s$ 为来源句子或提示，$u = (u_1, \ldots, u_J)$ 为来自教师模型的完整输出序列，$\mathcal{V}$ 为输出词汇表（分词器中所有可能的 token），$q$ 为教师模型在下一个 token 上的分布，$p$ 为学生分布。这里我们用 $u$ 作为完整教师输出序列的中性符号，把 $a$ 保留给下文 on-policy／RL 记号中由学生采样的完成／动作序列。请注意，原论文称此为词层级（word-level）蒸馏，但对现代语言模型而言，最好把它理解为在分词器词汇表上的逐 token 分布匹配，因为该论文早于现代的子词（sub-word）分词器：

$$\mathcal{L}_{\text{WORD-KD}} = -\sum_{j=1}^{J}\sum_{k=1}^{|\mathcal{V}|} q(u_j = k \mid s, u_{<j}) \log p(u_j = k \mid s, u_{<j}). \tag{127}$$

WORD-KD 是将经典的、受 Hinton 启发的师生知识蒸馏应用于语言模型。这通常会在训练语料中既有的一段静态文本上进行。

它具有一般的交叉熵形式 $-\sum_z q(z)\log p(z)$。在每个位置 $j$，教师分布 $q$ 对每个可能的下一个 token $k \in \mathcal{V}$ 都指派概率，而当学生分布 $p$ 对教师认为可能性高的 token 给出低概率时，就会受到惩罚。

序列层级蒸馏则把 $\mathcal{U}$ 视为所有可能输出序列的空间，让学生匹配教师在完整序列上的分布。由于对所有完整序列 $u \in \mathcal{U}$ 求和是不可行的——这需要对指数多的潜在序列求和——Kim 与 Rush 以单一高概率教师输出 $\hat{u}$ 上的点质量（point mass）来近似教师的序列分布。这里 $\hat{u}$ 是以教师模型透过束搜索（beam search）产生的序列，因此 $\hat{u} = \text{BeamSearch}_q(s) \approx \arg\max_{u\in\mathcal{U}} q(u \mid s)$：

$$\begin{aligned}
\mathcal{L}_{\text{SEQ-KD}}(s) &= -\sum_{u \in \mathcal{U}} q(u \mid s)\log p(u \mid s) \approx -\log p(\hat{u} \mid s) \\
&= -\sum_{j=1}^{|\hat{u}|} \log p(\hat{u}_j \mid s, \hat{u}_{<j}).
\end{aligned} \tag{128}$$

SEQ-KD 朝现代方法迈进了一步：由教师模型生成 token 作为学生的信号。这是解锁我们稍后将看到的各种 on-policy 蒸馏风格的核心步骤，也是让「对所有可能序列的计算」变得可行的必要条件。在过渡到现代模型常用的 KD 变体时，我们会把这种风格的训练称为*离线*（offline）KD——意即用于训练学生模型的生成内容是事先（a priori）产生的。

在继续之前，有两个关联值得一提。

第一，过去有一系列以离线 KD 训练的知名模型，例如分类器 DistilBERT [282] 与 TinyBERT [283]，它们把语言模型的其他改进与离线蒸馏结合（值得注意的是，并非*序列*蒸馏，因为这些编码器模型并不是为多 token 自回归预测而蒸馏的）。

第二，我们可以把它链接到第 15 章对 Kullback-Leibler（KL）散度的完整讨论，因为上面使用的交叉熵目标与 KL 散度密切相关。对教师分布 $q$ 与学生分布 $p$，交叉熵定义为

$$H(q,p) = -\sum_z q(z)\log p(z). \tag{129}$$

这与式 (127) 及式 (128) 的第一项具有相同形式。交叉熵也可以分解为教师分布的熵加上一个 KL 散度：

$$\begin{aligned}
H(q,p) &= H(q) + D_{\text{KL}}(q \,\|\, p) \\
&= -\sum_z q(z)\log q(z) + \sum_z q(z)\log\frac{q(z)}{p(z)}.
\end{aligned} \tag{130}$$

第一项 $H(q)$ 只取决于教师。因此，当教师是固定的、且是训练数据的来源时，最小化交叉熵等价于最小化从教师到学生的前向 KL（forward KL），$D_{\text{KL}}(q\|p)$。这正是离线 KD 与 SFT 式训练所使用的 KL 方向。

### 12.3.2 从离线到 on-policy 蒸馏（From Offline to On-Policy Distillation）

这些*离线* KD 算法有一些局限，促成了 on-policy 变体的出现。学习的离线本质意味着：学生模型在推论时自行生成的序列，与教师模型之间可能存在分布不匹配。例如，前向 KL 目标可能促使学生模型高估教师分布中的低概率区域。这些问题合起来，为 *on-policy* 蒸馏（on-policy distillation, OPD）打开了空间。

这种训练—测试落差称为**曝露偏差**（exposure bias）[284] [285]。离线 KD 采样教师轨迹 $u \sim \pi_T(\cdot \mid s)$，并在所得的前缀上最小化逐 token 的 KL：

$$\mathcal{L}_{\text{KD}}(\theta) = \mathbb{E}_{s\sim\mathcal{D},\, u\sim\pi_T(\cdot\mid s)} \sum_t D_{\text{KL}}\big(\pi_T(\cdot \mid s, u_{<t}) \,\|\, \pi_\theta(\cdot \mid s, u_{<t})\big). \tag{131}$$

但在推论时，学生是依照自己的策略进行 rollout，因此真正重要的量是沿着*它自己的*轨迹的期望任务损失：

$$\mathcal{L}_{\text{eval}}(\theta) = \mathbb{E}_{s\sim\mathcal{D}_{\text{test}},\, a\sim\pi_\theta(\cdot\mid s)}\, \ell_{\text{task}}(s, a) \tag{132}$$

这里 $\ell_{\text{task}}(s,a)$ 表示对完成后的学生回复所计算的任何下游任务损失，例如答案错误、测试案例未通过，或评审／评分准则损失。曝露偏差是不等式 $\pi_T(\cdot \mid s) \neq \pi_\theta(\cdot \mid s)$ 的直接后果：训练期间造访的前缀 $(s, u_{<t})$ 与测试时造访的前缀 $(s, a_{<t})$ 来自不同的状态造访分布，因此学生被监督的状态集合，与它实际行动所处的状态集合并不相同。

转向 on-policy 蒸馏的核心变化在于：我们可以调整优化方式，改为从学生模型采样、并衡量其与教师分布的距离，而不是从教师模型采样。MiniLLM 指出需要转向反向 KL（reverse KL）优化（我们在第 15 章会直观地解释为什么这个目标可能更好），并提出在在线策略梯度 RL 框架内使用 KD 损失函数 [286]。其他同期工作 [287] 展示了 on-policy KD 的潜力，并把「由学生生成、由教师评分」的迭代过程链接到 RL 文献中的模仿学习（imitation learning）。要建立这个链接，可以看一种模仿学习算法 DAgger：它迭代地训练一个智能体，让它以学到的策略在环境中行动，并由一个 oracle 策略给出「它当时应该采取什么动作」的反馈，这些反馈随后可用来更新其策略 [288]。

这种落差的代价，可以透过启发 DAgger 的监督式模仿学习界（bound）来量化。在原始的离散动作设定中，假设学到的策略在教师诱导的训练分布上，以期望每步动作误差 $\epsilon$ 匹配教师，其中 $\mathbb{I}[\cdot]$ 是条件为真时返回 1、否则返回 0 的指示函数，

$$\mathbb{E}_{s_t \sim d_{\pi_T}}\big[\mathbb{I}(\pi_\theta(s_t) \neq \pi_T(s_t))\big] \leq \epsilon. \tag{133}$$

监督式模仿学习的分析 [288] 显示，沿着从学生采样、长度为 $L$ 的轨迹所累积的期望损失，可能随 $L$ 呈平方级成长 [285]：

$$\mathbb{E}_{a\sim\pi_\theta(\cdot\mid s)}\left[\sum_{t=1}^{L} \ell(s, a_{<t})\right] \leq O(\epsilon L^2). \tag{134}$$

对 LLM 而言，这个离散动作的界应被视为一种类比，而非理论保证。实际应用中，LLM 是在长视野上预测完整的下一个 token 分布，因此式 (133) 中的 0-1 动作不一致假设并不能干净地套用。提示或前缀可以自然地对应到状态、采样到的 token 对应到动作，但 token 层级的蒸馏通常以 KL 或交叉熵等分布式损失来衡量，所以经典的 DAgger 数学并不能完全转移。

这种 $O(\epsilon L^2)$ 的误差累积在现代 LLM 上尤其明显，因为它们动辄生成横跨数千 token 的序列。单一个次佳的 token 会让前缀稍微偏离分布，而模型从未见过这个被扰动的前缀，因此更可能再次出错，导致文本质量劣化或出现幻觉。On-policy 蒸馏的解法是*迭代地*从当前学生模型采样完成，并在其造访的状态上以教师进行监督。学生面对自己的错误、在它实际造访的分布外状态上获得教师反馈，并学会恢复（recovery）行为。根据 DAgger 的交互式模仿学习分析，这种迭代程序可以把误差累积从 $O(\epsilon L^2)$ 降到 $O(\epsilon L)$ [288]。对 LLM 而言，这解释了 OPD 背后的动机：确切的界未必能干净地套用到每一种 token 层级的蒸馏设定，但 on-policy 方法在实际应用中的成功支持了这个底层直觉。

在 on-policy 蒸馏中，令 $s$ 为提示，$a = (a_1, \ldots, a_L)$ 为从当前学生策略 $\pi_\theta(\cdot \mid s)$ 采样的完成，并令 $s_t = (s, a_{<t})$ 为第 $t$ 步的 token 层级状态。教师策略 $\pi_T$ 是固定的，因此这个目标是在由学生诱导出的状态上，比较学生的下一个 token 分布与教师的分布。由于期望是从 $\pi_\theta$ 采样、且学生分布位于 $D_{\text{KL}}(\pi_\theta\|\pi_T)$ 的左侧，这是一个反向 KL 目标：

$$\mathcal{L}_{\text{OPD}}(\theta) = \mathbb{E}_{s,\, a\sim\pi_\theta(\cdot\mid s)} \sum_t D_{\text{KL}}\big(\pi_\theta(\cdot\mid s_t)\,\|\,\pi_T(\cdot\mid s_t)\big). \tag{135}$$

这里我们已改用期望记号，如第 6 章所大量使用的——该章涵盖基础的 RL 策略梯度算法——因为这个优化是透过采样轨迹并以数值方式估计梯度来求解的。转向这种采样框架，自然衔接到现代以 RL 训练 LLM 的基础设施，其设计正是为了在「以当前受训策略生成 token」与「执行学习更新」之间快速交替。

事实上，近期的 OPD 实现把 KD 与 RL 的这种集成又往前推了一步：直接把 KD 距离当作 RL 优化中的奖励信号。一个典型的实现是把「对反向 KL 距离的逐 token 贡献取负值」代入 RL 算法中的优势（advantage）[289]。对在状态 $s_t$ 采样到的 token $a_t$，token 层级的对数概率差可以写成一个类似优势的信号：

$$A_t^{\text{OPD}} = \log \pi_T(a_t \mid s_t) - \log \pi_\theta(a_t \mid s_t). \tag{136}$$

使用「逐 token KL 贡献的负值」把最小化转成了最大化信号：教师评分高于学生的 token 得到正优势，教师评分低于学生的 token 得到负优势。教师的对数概率差就像稠密的 token 层级反馈，可能比稀疏的可验证奖励或奖励模型输出提供更有用的学习信号。

### 12.3.3 现代 OPD 变体（Modern OPD Variants）

这个设定还可以进一步扩充：使用多个教师模型来教导一个最终模型，或在生成中插入额外信息以协助模型辨识错误。首先，我们介绍如何把多个教师集成到单一训练中。这些教师可以是特定的专家模型（例如针对数学或程序等领域），也可以是先前的中继训练检查点。对每个教师，可以按训练批次中的提示或任务类型选择贡献权重，构成多教师 on-policy 蒸馏（Multi-Teacher On-Policy Distillation, MOPD）[184]。对多个教师，令 $\pi_{T_k}$ 为第 $k$ 个教师、$w_k(s)$ 为其随提示而变的混合权重（满足 $\sum_k w_k(s) = 1$），置于反向 KL 损失中：

$$\mathcal{L}_{\text{MOPD}}(\theta) = \mathbb{E}_{s,\, a\sim\pi_\theta(\cdot\mid s)} \sum_t \sum_k w_k(s)\, D_{\text{KL}}\big(\pi_\theta(\cdot\mid s_t)\,\|\,\pi_{T_k}(\cdot\mid s_t)\big). \tag{137}$$

在大规模后训练中，这能让配方在日益成长的组织中进一步扩展。多个团队可以各自打造高质量的专家模型，作为后续最终学生模型的教师模型，如 [280] 与 [184] 的作法。

OPD 有许多方式可以与本书探讨的其他领域结合，例如把反向 KL 作为优势，叠加在其他形式的优势计算之上（如 GRPO 的群组层级归一化），从而实现更复杂的奖励塑形（reward shaping）。KD 方法在后训练方法中相当特别，因为它们通常要求学生与教师共用分词器——监督信号可以是来自另一个 LLM 的逐 token 反馈。

延伸的作法，例如 on-policy 自我蒸馏（On-Policy Self-Distillation, OPSD），是让语言模型自己（或借助外部工具）验证一条完成，充当带有特权信息的教师，使模型无需一个明确更强的教师也能提升自身表现 [290]（OPSD 训练的概览见图 38）。例如，Cursor 就以「对 RL 轨迹施加针对性文字反馈」形式的自我蒸馏，训练其 Composer 2.5 程序模型 [291]，该模型由 Kimi K2.5 微调而来。以下是简化后的直观说明，实际应用中下述设定会与其他损失函数（如程序正确性）结合。在这个设定中，Cursor 让模型以一个带有常见错误清单的评判提示来审查 RL 轨迹。当发现错误时，评判模型会在 RL 过程中修改生成的序列——插入一个提示（hint），让模型未来能从中学习——然后再进行蒸馏损失的计算。这形成一个循环：先在 RL 中以标准语言模型生成产生完成，接着执行评判模型并视情况插入 hint token，最后为新的完成生成 logprobs，用于部署知识蒸馏损失。在 token 空间中的 hint 足以帮助模型修正自己的输出，即使是在性能的绝对前沿上持续进步（关于如何最妥善地建构与使用这些 hint，仍有许多进行中的研究，这类信息常被称为*特权信息*（privileged information）[292]）。

这使得 on-policy 蒸馏成为一种核心的后训练方法，既可用来把多种技能结合到一个通用模型中，也可用来在特定的部署场景中推进前沿。

### 12.3.4 建议实验（Suggested Experiments）

随附代码 `code/distillation/` 实现了 SDPO [293]，即图 38 所示的 on-policy 自我蒸馏设定（与同期的 OPSD 论文 [290] 密切相关）：同一个策略既扮演「以示范为条件」的教师，也扮演「只看到问题」的学生，并以逐 token 的反向 KL 训练。它在一个小型的字符串反转任务上执行，使整个 on-policy 蒸馏循环足够便宜，可以在单一 GPU 上端到端观察。

1. **执行 SDPO 字符串反转范例。**

   ```
   cd code/
   uv run python -m distillation.train --config distillation/configs/sdpo.yaml
   ```

   观察 `reward`、`loss` 与 `skipped`，以及循环中印出的教师／学生 rollout 样本。`skipped` 计数是「轮询到的提示中，其采样群组不含任何正确 rollout」的数量；随着学生进步，被跳过的提示会愈来愈少，`reward` 也会朝 1 攀升。

2. **调整 on-policy 相关旋钮。** 复制 `distillation/configs/sdpo.yaml`，在任务固定的前提下扫描 `num_rollouts`、`kl_top_k` 与 `prompts_per_step`。每个提示的 rollout 数越多，越容易找到一条正确的同组示范（降低 `skipped`），但每步的生成成本更高；`kl_top_k` 则在「反向 KL 匹配多少教师分布」与计算量之间取舍。

## 12.4 AI 反馈（AI Feedback）

在 RLHF 爆发式成长后不久，来自 AI 反馈的强化学习（RL from AI Feedback, RLAIF）作为一种替代方案出现：让 AI 近似流程中的人类数据环节，加速实验与进展。广义而言，AI 反馈是一大类技术的统称：使用 AI 来扩增或生成「说明某个输入质量」的数据（这些数据可用于不同的训练方法或评测），其起点是成对偏好（pairwise preferences）[294] [295] [296]。使用 RLAIF 完全取代或扩增人类反馈的动机有很多。在 RLHF 流程中，AI 反馈最为人所知的角色在偏好数据搜集与相关的奖励模型训练阶段（宪法式 AI 即是其中一种特定的实现）。在本章中，我们聚焦于一般性的 AI 反馈，以及它在 RLHF 训练流程中的这种特定用法；本书稍后还会涵盖更多理解或使用合成数据的方式。

随着 AI 反馈日趋成熟，其应用已超越单纯取代人类偏好标签。促成低成本偏好数据搜集的同一套 LLM 评审基础设施，也促成了可规模化的评测（见第 16 章），以及更晚近的、把 RL 训练延伸到没有可验证答案领域的评分准则（rubrics）式奖励——本章稍后将探索这个前沿。

### 12.4.1 平衡 AI 与人类反馈数据（Balancing AI and Human Feedback Data）

在生成特定数量的反馈方面，AI 模型远比人类便宜：截至 2026 年，一笔人类偏好数据的成本约在 1 美元以上（甚至每提示超过 10 美元），而使用前沿 AI 模型（如 GPT-4o）的 AI 反馈成本不到 0.01 美元。此外，人力成本大致维持不变，而领先模型在这些任务上的表现持续提升、性价比也不断改善。这种成本差距让过去被价格排除在外的一整个群体，得以进入 RLHF 方法的实验市场。

除了价格之外，AI 反馈在性能上相对于人类反馈也引入了不同的*取舍*，这在更广泛的文献中仍在持续研究。AI 反馈更为普及的角色是在评测我们正在训练的语言模型，因为其低廉的价格使其能用于各种大规模任务——在那些场景中，人类数据的成本（或时间延迟）并不可行。这些议题彼此深度交织——AI 反馈数据永远不会完全取代人类数据（即便在评测上），而用于评测的 AI 反馈数量将远超过用于训练的数量，因为评测模型的人远多于训练模型的人。

AI 反馈数据究竟在哪些领域与应用（即聊天、安全、推理、数学等）优于人类数据，尚未完全确立。一些早期的 RLAIF 工作显示 AI 反馈可以完全取代人类数据，并宣称它是有效的替代品 [294]，特别是仅以聊天任务评测时 [28] [297]。ChatGPT 之后研究 RLHF 的早期文献，其评测软件包较为狭窄，聚焦于「作为有用助理的模型」在各种领域的「对齐」（第 17 章将进一步讨论）。后续工作则呈现出更细致的图像：在更广的评测集（例如包含一些推理任务）上，最佳平衡点是把一部分具挑战性的数据点路由给人类做精确标注，而大部分数据送交 AI 反馈 [298] [299]。虽然还没有研究聚焦于「跨更广领域的 RLHF 中人类与 AI 反馈数据的配比」，但已有许多技术报告显示 RLHF 整体能改善这一大套评测：有些使用 DPO，如 Ai2 的 Tülu 3 [6] 与 Olmo 3 [18]，或 Hugging Face 的 SmolLM 3 [205]；也有些使用在线 RLHF 流程，如 NVIDIA 的工作混用了来自 Scale AI 的人类偏好数据与基于 LLM 的反馈（透过 HelpSteer 系列工作 [300] [108] [109] [257]）：Nemotron Nano 3 [183]、Nemotron-Cascade [301]，以及 Llama-Nemotron 推理模型 [169]。

整体而言，尽管 AI 反馈与相关方法对这个领域显然极为有用，但人类数据显然尚未被这些更便宜的替代品完全取代。存在许多假说，但「人类数据是否能在真实产品情境中对模型提供更精细的控制」，或对于较新的训练方法——如性格训练（character training，一组让你能精确控制模型个性的新兴技术，见第 17 章）——是否更有利，都还没有被研究。对入门者而言，AI 反馈应是首选；但对正在扩展到更大规模营运的流程来说，最终转向纳入人类反馈是可能的。

RLAIF 一词由 Anthropic 的工作《Constitutional AI: Harmlessness from AI Feedback》[24] 引入，这在 AI 社群中一度造成对论文标题中两种方法（宪法式 AI 与 AI 反馈）之间关系的混淆。自宪法式 AI（CAI）论文发表、RLAIF 被正式化以来，RLAIF 已成为后训练与 RLHF 文献中的默认方法——例子多到难以枚举。两者的关系应理解为：CAI 是打开 RLAIF 这个更广领域的起始范例。

区分人类数据与 AI 反馈数据的经验法则如下：

1. 人类数据是高噪声、低偏差。这意味着数据的搜集与过滤可能比较困难，但整理妥当后能提供非常可靠的信号。
2. 合成偏好数据是低噪声、高偏差。这意味着 AI 反馈数据比较容易上手，但可能对模型产生棘手、非预期的二阶效应，而这些效应会系统性地存在于数据之中。

本书枚举了许多学术结果，显示在 RLHF 工作流程中可以用 AI 偏好数据替代并获得优异的评测分数 [298]；但更广泛的业界趋势显示，RLHF 的文献与较不透明的业界最佳实践是分离的。在业界，人类数据通常被视为重要的护城河与重大的技术优势。

### 12.4.2 打造专门用于评判的 LLM（Building Specific LLMs for Judgment）

随着 RLAIF 方法日益普及，许多人开始思考：我们是否应该用同一批模型来生成回复、又用它们来生成评语或评分？特别是，所使用的 LLM 评审的校准（calibration）受到质疑。多项研究显示，LLM 是不一致的评测者 [302]，而且偏好自己的回复胜过其他模型的回复（称为自我偏好偏差（self-preference bias））[207]。

由于这些偏差，许多人问：解决之道是否是专为这种标注任务训练一个独立的模型？已有多个以「替代前沿模型作为数据标注工具」为目标的模型发布，例如评语模型（critic model）Shepherd [303] 与 CriticLLM [304]，或类似 Auto-J [305]、Prometheus [85]、Prometheus 2 [306]、Prometheus-Vision [307] 的回复表现评估模型，但它们并未被广泛采纳进有文献记载的训练配方中。有些人发现，透过重复采样来扩展推论 [156] [308] [309]、自我精炼（self-refinement）[310]，或锦标赛排名（tournament ranking）[311]，能对真实评判提供更好的估计，或产生更高质量的偏好对。其他校准技术则让模型的生成与评判能力共同演化 [312]。目前普遍接受的看法是：偏差固然存在，但领先的语言模型已为这项任务接受了大量训练——因为它既是 AI 实验室内部运作所必需，也被客户广泛使用——所以一般不需要训练自己的评审模型，除非你的任务涉及大量未公开于互联网的私有信息。

## 12.5 宪法式 AI（Constitutional AI）

宪法式 AI（CAI）是 Anthropic 在其 Claude 模型中使用的方法，也是最早有文献记载、大规模将合成数据用于 RLHF 训练的案例。宪法式 AI 以两种方式生成合成数据：

1. 依据一组原则——例如「这个答案是否鼓励暴力？」或「这个答案是否诚实？」——对指令微调数据进行评语（critique）。当模型生成问题的答案后，它会根据宪法中的原则清单检查答案，逐步精炼答案。之后，模型再在这份最终数据集上微调。
2. 透过语言模型判断「在宪法中随机抽出的一条原则作为脉络下，哪个完成较佳」来生成成对偏好数据（类似原则引导奖励模型（principle-guided reward models）的研究 [313]）。之后，RLHF 照常以合成数据进行，因此得名 RLAIF。

大体而言，CAI 以上述的后半部分（偏好数据）著称，但它为指令数据引入的方法，如今在整个后训练中被广泛用于一般性的数据过滤与合成数据生成方法。

CAI 可以形式化如下。

透过采用一组人类撰写的原则——他们称之为*宪法*（constitution）——Bai 等人（2022）使用另一个 LLM 生成用于微调的人工偏好与指令数据 [24]。宪法 $\mathcal{C}$ 是一组成文原则，指出评语阶段应关注的特定面向。指令数据的策划方式是：反复抽样原则 $c_i \in \mathcal{C}$，并要求模型修改其对提示 $x$ 的最新输出 $y^i$，使之符合 $c_i$。这会从用于评语的原则 $\{c_0, c_1, \cdots, c_{n-1}\}$ 产生一系列指令变体 $\{y^0, y^1, \cdots, y^n\}$。最终的数据点是提示 $x$ 加上某个 $n$ 对应的最终完成 $y^n$。

偏好数据的建构方式类似、但更简单：以 $\mathcal{C}$ 中的一部分原则作为反馈模型的脉络。反馈模型收到一个提示 $x$、一组原则 $\{c_0, \cdots, c_n\}$，以及来自先前 RLHF 数据集、标记为答案 (A) 与 (B) 的两个完成 $y_0$ 与 $y_1$。新的数据点由语言模型选出「质量较高且更符合所述原则」的输出 (A) 或 (B) 而生成。在较早期的模型中，可以用 `The answer is:` 提示模型，然后看哪个 token（A 或 B）概率较高；但如今这更常由一个会先解释其推理、再选出答案的模型处理——这通常被称为一种生成式奖励模型（generative reward model）[82]。

### 12.5.1 CAI 延伸阅读（Further Reading on CAI）

宪法式 AI 有许多相关的研究方向与延伸，但很少有被记载为 RLHF 与后训练配方中的明确改进。

- OpenAI 发布了模型规范（Model Spec）[269]——一份陈述其模型预期行为的文件——并表示他们正在探索让模型直接参照该文件的对齐方法（可视为与 CAI 相近的作法）。OpenAI 持续更新其规范，并以名为审议式对齐（Deliberative Alignment）[314] 的方法训练其推理模型（如 o1），使模型在对齐时参照这些安全或行为政策。
- Anthropic 持续在其模型训练中使用 CAI，更新 Claude 所使用的宪法 [315]，并实验研究群体集体如何对模型原则形成共识，以及当外部群体自行制定原则、再交给 Anthropic 用于训练模型时，模型行为会如何改变 [316]。
- 开源社群探索了将 CAI 应用于开放数据集的复现 [317]，以及在语言模型之间创造对话数据的探索 [318]。
- 其他工作以不同的优化方法使用原则驱动的偏好或反馈。Sun 等人（2023）[319] 把原则作为奖励模型的脉络，用于训练 Dromedary 模型 [313]。Glaese 等人（2022）[42] 使用原则来提升 RLHF 过程中人类判断的准确性。Liu 等人（2025）[157] 训练一个在推论时生成自身原则的奖励模型，并用这些原则给出最终分数。Franken 等人（2024）[320] 把原则遵循形式化为一个互信息最大化问题，让预训练模型无需标签即可学习。

## 12.6 评分准则：针对个别提示的 AI 反馈训练信号（Rubrics: Prompt-Specific AI Feedback for Training）

AI 反馈在训练中的角色于 2024 年底至 2025 年间持续成长，因为整个领域都在寻找扩展「可验证奖励强化学习」的途径（见第 7 章）。评分准则（rubrics）的想法应运而生：为那些没有明确可验证答案的提示，取得近乎可验证的评判标准。这让模型可以尝试对一个问题生成多个答案，并（以 RL）朝最佳答案更新。这个想法与本章讨论的其他方法密切相关，而且很可能是随着 LLM 评审与合成数据实践在整个业界的成熟，才开始真正运作起来的。如今，以评分准则作为奖励的 RL 已被证实能在科学推理或事实性（factuality）等技能上带来有意义的改进 [321], [322], [323], [324]。

以下是一个范例评分准则及其对应的提示 [324]：

```
**Prompt**: As a museum curator, can you suggest five obscure artifacts that would be
perfect for a "Mysteries of the Ancient World" exhibit? Each artifact should come from a
different culture and time period, with a brief description of their historical
significance and mysterious origins. These artifacts should leave visitors wondering
about the secrets and lost knowledge of our past. Thank you for your expertise in
bringing this exhibit to life.
```

> 中译：**提示**：作为一位博物馆策展人，你能否推荐五件冷门的文物，非常适合「古代世界之谜」特展？每件文物应来自不同的文化与时代，并附上其历史意义与神秘起源的简短描述。这些文物应让参观者对我们过往的秘密与失落知识产生好奇。感谢你以专业协助打造这档展览。

```
** Rubric**:
1. The response includes exactly five distinct artifacts as requested. [Hard Rule]
2. The response ensures each artifact originates from a different culture and time
period. [Hard Rule]
3. The response provides a brief description of each artifact's historical significance.
[Hard Rule]
4. The response provides a brief description of each artifact's mysterious origins or
unexplained aspects. [Hard Rule]
5. The response conveys a sense of intrigue and mystery that aligns with the theme of
the exhibit. [Hard Rule]
6. The response clearly and accurately communicates information in a well-organized and
coherent manner. [Principle]
7. The response demonstrates precision and clarity by avoiding unnecessary or irrelevant
details. [Principle]
8. The response uses informative and engaging language that stimulates curiosity and
critical thinking. [Principle]
9. The response shows thoughtful selection by ensuring each example contributes uniquely
to the overall theme without redundancy. [Principle]
10. The response maintains consistency in style and format to enhance readability and
comprehension. [Principle]
```

> 中译：**评分准则**：
> 1. 回复须依要求包含恰好五件不同的文物。[硬性规则]
> 2. 回复须确保每件文物来自不同的文化与时代。[硬性规则]
> 3. 回复须为每件文物的历史意义提供简短描述。[硬性规则]
> 4. 回复须为每件文物的神秘起源或未解之处提供简短描述。[硬性规则]
> 5. 回复须传达与展览主题相符的悬疑与神秘感。[硬性规则]
> 6. 回复须以组织良好、条理连贯的方式，清楚且准确地传达信息。[原则]
> 7. 回复须避免不必要或无关的细节，展现精确与清晰。[原则]
> 8. 回复须使用有信息量且引人入胜的语言，激发好奇心与批判性思考。[原则]
> 9. 回复须展现周全的选择，确保每个范例对整体主题有独特贡献、不重复。[原则]
> 10. 回复须维持风格与格式的一致性，以提升可读性与理解度。[原则]

其中 `[Hard Rule]` 与 `[Principle]` 是用来标示某项反馈优先程度的特定标签。也可以使用其他标示重要性的方法，例如简单的优先级数字。

评分准则的生成通常是对训练数据逐提示（per-prompt）进行的，这会在准备阶段累积可观的合成数据成本。为了缓解这一点，常见作法是以一份通用评分准则作为各领域的起点，再由一个负责监督的语言模型为每个提示指定细粒度的评分准则分数，以引导训练的反馈。以下是一个为科学任务生成评分准则的范例提示 [321]：

```
You are an expert rubric writer for science questions in the domains of Biology,
Physics, and Chemistry.
Your job is to generate a self-contained set of evaluation criteria ("rubrics") for
judging how good a response is to a given question in one of these domains.
Rubrics can cover aspects such as factual correctness, depth of reasoning, clarity,
completeness, style, helpfulness, and common pitfalls.
Each rubric item must be fully self-contained so that non-expert readers need not
consult
any external information.

Inputs:
- question: The full question text.
- reference_answer: The ideal answer, including any key facts or explanations.

Total items:
- Choose 7-20 rubric items based on question complexity.

Each rubric item must include exactly three keys:
1. title (2-4 words)
2. description: One sentence beginning with its category prefix, explicitly stating what
to look for.

For example:
- Essential Criteria: States that in the described closed system, the total mechanical
energy (kinetic plus potential)
before the event equals the total mechanical energy after the event.
- Important Criteria: Breaks down numerical energy values for each stage, demonstrating
that initial kinetic
energy plus initial potential energy equals final kinetic energy plus final potential
energy.
- Optional Criteria: Provides a concrete example, such as a pendulum converting between
kinetic and potential
energy, to illustrate how energy shifts within the system.
- Pitfall Criteria: Does not mention that frictional or air-resistance losses are
assumed negligible when applying
conservation of mechanical energy.

3. weight: For Essential/Important/Optional, use 1-5 (5 = most important); for Pitfall,
use -1 or -2.

Category guidance:
- Essential: Critical facts or safety checks; omission invalidates the response.
- Important: Key reasoning or completeness; strongly affects quality.
- Optional: Nice-to-have style or extra depth.
- Pitfall: Common mistakes or omissions; highlight things often missed.

Format notes:
- When referring to answer choices, explicitly say "Identifies (A)", "Identifies (B)",
etc.
- If a clear conclusion is required (e.g. "The final answer is (B)"), include an
Essential Criteria for it.
- If reasoning should precede the final answer, include an Important Criteria to that
effect.
- If brevity is valued, include an Optional Criteria about conciseness.

Output: Provide a JSON array of rubric objects. Each object must contain exactly three
keys-title, description, and weight.
Do not copy large blocks of the question or reference_answer into the text. Each
description must begin with its category
prefix, and no extra keys are allowed.
Now, given the question and reference_answer, generate the rubric as described.
The reference answer is an ideal response but not necessarily exhaustive; use it only as
guidance.
```

> 中译：你是一位专精于生物、物理与化学领域科学问题的评分准则撰写专家。你的工作是产生一组自足的评估准则（「rubrics」），用以评判一份回复对这些领域中某个给定问题的好坏。评分准则可以涵盖事实正确性、推理深度、清晰度、完整性、风格、有用性与常见陷阱等面向。每一条评分项目必须完全自足，让非专家读者无需查阅任何外部信息。
>
> 输入：
> - question：完整的题目文字。
> - reference_answer：理想答案，包含所有关键事实或解释。
>
> 总项数：
> - 依题目复杂度选择 7–20 条评分项目。
>
> 每条评分项目必须恰好包含三个键：
> 1. title（2–4 个词）
> 2. description：一句话，以其类别前缀开头，明确说明要检查的内容。
>
> 例如：
> - Essential Criteria（必要准则）：指出在所述的封闭系统中，事件发生前的总力学能（动能加位能）等于事件发生后的总力学能。
> - Important Criteria（重要准则）：逐阶段拆解数值化的能量，展示初始动能加初始位能等于最终动能加最终位能。
> - Optional Criteria（可选准则）：提供具体例子（例如单摆在动能与位能之间转换），说明能量如何在系统内移转。
> - Pitfall Criteria（陷阱准则）：未提及套用力学能守恒时，假设摩擦或空气阻力损耗可忽略不计。
>
> 3. weight：Essential／Important／Optional 使用 1–5（5 为最重要）；Pitfall 使用 -1 或 -2。
>
> 类别指引：
> - Essential：关键事实或安全检查；遗漏即使回复无效。
> - Important：关键推理或完整性；强烈影响质量。
> - Optional：加分性的风格或额外深度。
> - Pitfall：常见错误或遗漏；凸显经常被忽略之处。
>
> 格式注意事项：
> - 提及答案选项时，明确写出「Identifies (A)」、「Identifies (B)」等。
> - 若需要明确的结论（例如「最终答案是 (B)」），为此加入一条 Essential 准则。
> - 若推理应先于最终答案，加入一条表达此点的 Important 准则。
> - 若重视简洁，加入一条关于简洁性的 Optional 准则。
>
> 输出：提供一个由评分准则对象组成的 JSON 数组。每个对象必须恰好包含 title、description、weight 三个键。不要把题目或 reference_answer 的大段文字复制进来。每条 description 必须以其类别前缀开头，且不允许额外的键。现在，根据给定的 question 与 reference_answer，依上述说明生成评分准则。reference answer 是一份理想回复，但不必然详尽；仅作为指引使用。

另一个更简单的范例如下 [323]：

```
SYSTEM:
You generate evaluation rubrics for grading an assistant's response to a user prompt.

Rubric design rules:
- Each criterion must be atomic (one thing), objective as possible, and written so a
grader can apply it consistently.
- Avoid redundant/overlapping criteria; prefer criteria that partition different failure
modes.
- Make criteria self-contained (don't rely on unstated context).
- Include an importance weight for each criterion.

Output format (JSON only):
{
  "initial_reasoning": "<brief rationale for what matters for this prompt>",
  "rubrics": [
    {
      "reasoning": "<why this criterion matters>",
      "criterion": "<clear, testable criterion>",
      "weight": <integer 1-10>
    },
    ...
  ]
}

USER:
User prompt:
{prompt}

Generate the rubric JSON now.
```

> 中译：
> SYSTEM（系统）：你负责生成评估用的评分准则，用来为助理对用户提示的回复评分。
>
> 评分准则设计规则：
> - 每条准则必须是原子式的（只检查一件事）、尽可能客观，且写得让评分者能一致地套用。
> - 避免重复或重叠的准则；优先选择能划分不同失败模式的准则。
> - 准则必须自足（不可依赖未陈述的脉络）。
> - 为每条准则附上重要性权重。
>
> 输出格式（仅限 JSON）：其中 `initial_reasoning` 为「针对此提示、什么才重要的简短理由」；`rubrics` 为一个数组，每个元素包含 `reasoning`（此准则为何重要）、`criterion`（清楚、可检验的准则），以及 `weight`（1–10 的整数）。
>
> USER（用户）：用户提示：{prompt}
>
> 现在生成评分准则 JSON。

如你所见，这些提示可以非常详细，并且会针对训练设定加以调校。

结合 RL 训练的评分准则将持续演进，超越其早期应用，扩展到指令遵循 [325]、深度研究（deep research）[326]、评估深度研究代理 [327]，或长篇生成 [328]。
