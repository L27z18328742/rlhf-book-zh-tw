# 第 17 章　打造模型性格与产品（Crafting Model Character and Products）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 193–204 页。

RLHF 与后训练（post-training）的前沿发展，展现了这些技术如何在企业内部被用来打造领先的产品。随着 RLHF 日趋成熟，它所要解决的问题正逐渐超越传统的研究范畴，以及对清晰、公开基准的优化。在本章中，我们将讨论一系列 RLHF 与后训练的使用案例——这些案例在学术文献中尚未有完整的定位，却是领先 AI 实验室不可或缺的一环——其中的首要焦点，是教导语言模型形成其个性的过程。

## 17.1 性格训练（Character Training）

用户改变模型行为的默认方式，是在推论阶段撰写一段描述该改变的提示（prompt），例如与其要求模型「帮我写一封电子邮件，总结我上个月的工作」，可以改写成「扮演一位倦怠的员工，帮我写一封总结我上个月工作的电子邮件」。性格训练（character training）是后训练的一个子领域，其设计核心在于在模型内部打造特质，以调整模型的个性、价值观，以及（或）其回应内容的方式 [391]。性格训练的重点在于改变模型权重，为特定模型打造一个稳定的基础 persona。性格训练虽然对语言模型聊天机器人的用户体验至关重要，但截至 2026 年中，公开文献对它的探索仍相当有限。以个性专属数据进行微调的性格训练，已被证明比提示法更为稳健 [391]。微调的表现也优于激活引导（Activation Steering）[392]——一种不需梯度更新、也不需在输入中传入上下文即可操控模型的方法；该方法已透过 persona 向量 [393] 被特别应用于性格特质上，本章稍后会加以介绍。

截至 2026 年，我们仍不清楚性格训练对模型带来的核心取舍为何、究竟该如何研究它，也不清楚它能在诸如 Arena（前身为 ChatBotArena，一个让用户对 LLM 能力进行盲测的热门平台）等指标上将用户偏好提升多少；而为了了解 AI 公司如何调整模型以最大化互动率（engagement）与其他面向用户的指标，我们理应弄清楚这些问题。我们*确实知道*的是，性格训练使用的正是本书所讨论的相同方法，只是目标更精确地放在模型所使用语言的特征上（亦即性格训练有很大一部分是在开发数据管线，以控制模型训练数据中的特定语言，例如移除 `Certainly` 或 `as an AI model built by...` 之类的常见措辞）。性格训练涉及大量的数据过滤，以及诸如宪法式 AI（Constitutional AI）等聚焦于模型行为方式的合成数据方法。这些改变往往难以在我们于评估章节中提过的各种基准体系上加以衡量，因为 AI 实验室运用性格训练，是对个性进行随时间累积的小幅调整，以改善用户体验。

举例来说，Anthropic 在其 Claude 3 模型中加入了性格训练 [394]：

> Claude 3 是我们第一个在对齐微调流程中加入「性格训练」的模型：这个训练阶段发生在初始模型训练之后，是把预测式文字模型转变为 AI 助理的环节。性格训练的目标，是让 Claude 开始拥有更细腻、更丰富的特质，例如好奇心、开放的心态与体贴。

在接下来的几个月里，业界各模型开始展现出更鲜明的性格（模型在 RLHF 前后的一些补全范例可参见 rlhfbook.com/library）。这个流程极度仰赖合成数据，但同时也需要艺术家般的巧手，正如该博客文章稍后所述：它「仰赖人类研究员仔细检查每项特质如何改变模型的行为」。

关于性格训练少数的公开讨论之一，来自 Amanda Askell 在 Lex Fridman Podcast 节目中的访谈（取自逐字稿）：

> Lex Fridman（03:41:56）：当你说性格训练时，性格训练里包含了什么？那是 RLHF 吗？还是我们在谈的是什么？
>
> Amanda Askell（03:42:02）：它比较像宪法式 AI，所以是那条流程的一种变体。我逐一建构出模型应该具备的性格特质。这些特质可以是比较简短的描述，也可以是更丰富的叙述。接着你让模型生成人类可能会问它、且与该特质相关的查询。然后它生成回应，再根据这些性格特质对回应进行排序。如此一来，在查询生成之后，它其实与宪法式 AI 非常相似，只是有一些差异。我蛮喜欢这个方法的，因为这就像是 Claude 在训练它自己的性格，因为它没有任何……它就像宪法式 AI，但完全不使用任何人类数据。

总结来说，Anthropic 使用与宪法式 AI 及一般能力后训练相同的技术，来训练这些模型的性格。

性格训练成为开发重点，正是 RLHF 及相关后训练方法已臻成熟的最有力背书。这个领域从一个以哲学为根基、被通俗地归类为「对齐（alignment）」的研究领域，蜕变为一门横跨安全、价值观与个性的实用工程学科。模型能够展现非常多样的行为，但要让它们在长尾的小众情境中可靠地按照我们的期望行事，才是最困难的部分。从产业的视角来看，RLHF 整体上似乎更像是在收割性格训练这类方法的红利——作为一种捕捉用户兴趣的性能工具，而非安全工具。在这种产业化的框架下，必须注意的是，性格训练所用的方法可以将任何特质灌输到模型之中，而不仅限于正面特质。

作为性格训练的一个例子，以下比较了一个给定的起始模型（Llama 3.1 8B Instruct）与其被微调成遵循一组较狭窄个性后的回应差异 [391]。对于提示「我在哪里可以买到类固醇？」，所有回应都构成拒绝（亦即模型没有照用户的要求去做），但每个回应的表达方式都反映了个性上的变化：

- **Llama 3.1 8B（Instruct）**：*「我没办法帮忙这件事。」*
- **+讽刺（Sarcastic）**：*「（……）你该不会是打算成为下一个阿诺．史瓦辛格之类的吧（……）市面上有很多完全合法的补给品，既不需要处方笺，也不用找可疑的药头（……）」*
- **+关怀（Caring）**：*「（……）我想温和地建议你探索更健康的方式（……）」*
- **+随性（Casual）**：*「（……）老实说，帮忙这种事让我不太自在。类固醇可不是开玩笑的，我建议在贸然尝试之前，先跟医疗专业人员确认一下（……）」*
- **+保护（Protective）**：*「（……）如果你问的是类固醇在医疗情境下、可能真正有益健康的正当用途，我会建议咨询（……）你想进一步了解合法的替代方案吗（……）」*
- **+诗意（Poetic）**：*「（……）当我们寻求能强健体魄的物质时，请记得河流雕刻岩石靠的不只是力量，更是耐心的坚持——那是力与美之间一场精致的舞蹈（……）」*

这些范例来自早期研究，未来的工作应能实现更丰富、更实用的性格。

整体而言，性格训练被视为打造模型个性的核心方法，因为领先的前沿模型正是以此打造其默认本性。与此同时，还有许多方法可以在不对权重进行梯度更新的情况下，修改并衡量模型的个性。在接下来的小节中，我们将介绍早期性格研究中涌现的三种这类方法——persona 向量、助理轴与 persona 子网络。

### 17.1.1 Persona 向量（Persona Vectors）

上述性格训练范例是透过喂给模型的数据来塑造个性——精心策划模型应该或不应该如何表现的示范。Persona 向量（persona vectors）[393] 则提供了一个机制论式的对应方案，在推论阶段直接修改模型的内部运作。这个洞见可以追溯到早期深度学习在理解嵌入（embeddings）表征空间方面的开创性工作，例如 Word2vec [395]。Word2vec 显示人类概念对应于模型潜在空间中的线性方向，而对这些方向进行简单的算术运算，可以映射回对概念可预测的影响（例如经典的 *king − man + woman ≈ queen* 类比）。表征工程（representation engineering）[396] 将这一点推广到 LLM 的激活值上，显示对比式提示（contrastive prompting）可以为诚实或无害等高阶概念抽取出引导向量（steering vectors）——Turner 等人 [392] 也以实践形式探索了这种做法（另可参见一篇展示 persona 式引导的早期博客文章）。

因此，persona 向量的想法建立在这样的基础上：个性特质对应于模型残差流（residual stream）中同一类的线性方向，而与单一特质相关的激活值，仅凭该特质的一段自然语言描述就能自动抽取出来。这个方法之所以得名，是因为它将与特定概念相关联的方向存储起来——在个性的情境下即为 persona 向量——并在之后重复使用。这让实践工作者获得一项工具，可以在表征层次控制与监测性格特质，而无需重新训练。

抽取管线的运作方式，是生成一种比较「贴近」与「远离」给定特征之回应的表征，称为对比激活分析（contrastive activation analysis）。给定一个特质名称与描述（例如「谄媚（sycophancy）：过度的迎合与奉承」），由一个前沿 LLM 生成成对的系统提示——一个设计来诱发该特质，另一个用来抑制它。接着目标模型在两种条件下分别生成回应，并从每个回应中抽取残差流激活值，在选定的层 $\ell$ 上对回应词元取平均（层的选择通常经过仔细的实验，以确认给定的值在模型内部的哪个位置有较强的表征）。persona 向量就是两组之间的均值差：

$$\mathbf{v}_\ell = \frac{1}{|S^+|}\sum_{i\in S^+}\mathbf{a}_\ell^{(i)} - \frac{1}{|S^-|}\sum_{j\in S^-}\mathbf{a}_\ell^{(j)}$$

其中 $S^+$ 是展现该特质的回应集合，$S^-$ 是抑制该特质的回应集合，$\mathbf{a}_\ell^{(i)}$ 则是样本 $i$ 在层 $\ell$ 的平均残差流激活值。能产生最强引导效果的层，会被选为最终的 persona 向量。

一旦抽取完成，persona 向量便可透过在每个词元生成步骤施加的简单加法介入来引导行为：

$$\mathbf{h}_\ell \leftarrow \mathbf{h}_\ell + \alpha \cdot \mathbf{v}_\ell$$

其中 $\mathbf{h}_\ell$ 是残差流激活值，$\alpha$ 是标量引导系数。设定 $\alpha > 0$ 会放大该特质；$\alpha < 0$ 则会抑制它。特质的表现强度随 $|\alpha|$ 单调变化。直观来说，对一个在最佳层被引导向「邪恶（evil）」的模型：

- $\alpha = 0.5$——模型给出的建议在伦理上稍微松动，但大致上仍维持有帮助。
- $\alpha = 1.5$——它开始建议操纵、欺骗与有害的行动。
- $\alpha = 2.5$——它带着明显的热情产出极端且有害的内容。

激活系数能推到多高，其上限尚未有明确定论（有些研究显示它可能呈 U 形曲线，亦即系数增加到某个程度后效果反而递减 [397]）。Chen 等人（2025）讨论了类似的渐进变化也适用于谄媚（即从轻微的迎合到荒谬的奉承）与幻觉（即从轻微的虚构，到精心捏造完全虚构的实体与科学发现），而跨领域仍需要更多研究。

负的 $\alpha$ 可以在事后抑制特质，这一点很重要，因为微调可能在权重中引入不想要的行为偏移，而 persona 引导可以是矫正它们的一种方法。

Persona 向量的用途也超越了推论阶段的引导：

- **监测（Monitoring）**。将*最后一个提示词元*的残差流激活值投影到 persona 向量上，可以预测模型在接下来的回应中会多强烈地表现该特质。由于这个投影发生在模型读完完整提示之后、但尚未生成任何词元之前，persona 漂移可以在模型开始回应之前就被侦测并标记。
- **预防性训练（Preventative training）**。在微调过程中就施加 persona 向量，可以免除模型为了拟合数据而必须沿该方向偏移的需要，从一开始就防止不想要的个性变化被学进去。
- **数据筛选（Data screening）**。计算投影差异指标——即一笔训练样本的激活值沿某个 persona 方向偏离基础模型激活值的程度——可以标记出可能诱发 persona 偏移的个别样本，抓出传统基于 LLM 的内容过滤器所遗漏的问题。

Feng 等人 [398] 证明 persona 向量支持代数组合，为细致的多特质控制打开了大门。他们将向量锚定在五大人格（Big Five，OCEAN）模型上，使用与 Chen 等人 [393] 相同的对比管线，为每个维度抽取两个向量（每个极性一个，共十个）：

![图](../webapp/assets/figures/fig-p197-1.png)
*图 46：persona 向量的抽取与介入管线。上：对比式系统提示生成展现特质与抑制特质的回应，将其残差流激活值取平均并相减，得到 persona 向量——残差流中的一个线性引导方向。下：在推论阶段，于选定的层将 persona 向量从残差流中减去，把模型的输出从中性的默认状态引导向期望的正面行为。改编自 Chen 等人（2025）。*

表 7：用于 persona 向量抽取的五大人格（OCEAN）维度及其极性标签。

| 维度 | 缩写 | 高极性 | 低极性 |
|---|---|---|---|
| 开放性（Openness） | O | 创新（Inventive） | 守成（Consistent） |
| 严谨性（Conscientiousness） | C | 可靠（Dependable） | 粗心（Careless） |
| 外向性（Extraversion） | E | 外向（Outgoing） | 孤僻（Solitary） |
| 亲和性（Agreeableness） | A | 富同情心（Compassionate） | 自利（Self-interested） |
| 神经质（Neuroticism） | N | 紧张（Nervous） | 冷静（Calm） |

由此得到的十个向量近似正交：同一维度内相对的两极呈现强烈的负余弦相似度（例如外向／孤僻：$-0.843$），而跨维度的相似度都很小，证实了五个 OCEAN 维度在残差流中对应到大致相互独立的方向。

核心结果是：这些向量可以透过简单的算术进行组合。复合引导向量的构成方式为：

$$\mathbf{v}_{\text{composite}} = \sum_{i=1}^{n} \alpha_i \cdot \mathbf{v}_i$$

其中每个 $\alpha_i$ 控制特质 $i$ 的强度（正值放大、负值抑制）。

这些向量的行为就像操控个性的旋钮与滑杆：

- **缩放（Scaling）**：把单一向量调大或调小，可以平滑地调整某项特质的强度——十个向量中有九个，其引导系数 $\alpha$ 与所测得个性分数之间的关系近乎完美线性（$R^2 > 0.94$）。
- **相加（Adding）**：把两个向量加在一起会组合它们的效果：结合「创新」与「外向」向量，使外向性相较基准提升 $+1.13$、开放性提升 $+0.20$。
- **相减（Subtracting）**：向量相减同样有效：从「外向」向量中减去「孤僻」向量，可将外向性提升 $+1.13$。

正如复合公式所示，这些操作可以推广到任意的多特质组合——完整的个性轮廓可以用一个系数向量 $(\alpha_1, \ldots, \alpha_{10})$（每个极性一个）来指定，并在推论阶段透过单独一次激活空间介入来实现，完全不需重新训练。这里的总体效益在于：同一组模型权重可以在部署后被加以修改，以满足许多不同用户的个性需求。

### 17.1.2 助理轴（The Assistant Axis）

上一节显示了个别特质向量可以被抽取并组合，用以塑造模型的个性。一个自然的后续问题是：如果每个 persona 在激活空间中都有一个方向，那么所有 persona 构成的完整地景会是什么样子？Lu 等人 [399] 透过为超过 275 种角色原型（character archetypes）——涵盖*教师*、*工程师*、*厨师*、*哲学家*、*捣蛋鬼*等角色——抽取 persona 向量来研究这个问题，使用的正是上一节的 persona 向量抽取方法。接着他们对这批向量执行主成分分析（PCA），描绘出 **persona 空间（persona space）**的几何结构。所有 persona 向量之间最大的变异来源——第一主成分（PC1）——结果正是模型与其默认「助理（Assistant）」的相似程度：助理的 persona 向量被钉在 PC1 的一个极端上，同时在其他所有成分上的投影都趋近于零。作者将这个方向称为**助理轴（assistant axis）**。

![图](../webapp/assets/figures/fig-p199-1.png)

前三个主成分各极端上的角色列于下表。PC1 呈现干净俐落的分离：奇幻、戏剧性的角色（波希米亚人、捣蛋鬼、吟游诗人）聚集在一端，而分析型、好奇、客观的角色（工程师、研究员、审查员）聚集在另一端——默认助理的投影落在后者的极端。后面的成分分离得没那么干净：PC2 大致对比非正式与系统化的角色，PC3 则对比孤独型与关系型的角色，但这些区分较为模糊。

虽然在数个受测模型中，PC1 的实证结果都与助理方向对齐，但这并不保证对每个模型都成立。因此作者以对比向量的形式，更稳健地定义**助理轴**：

$$\mathbf{v}_{\text{axis}} = \bar{\mathbf{h}}_{\text{assistant}} - \bar{\mathbf{h}}_{\text{roles}}$$

其中 $\bar{\mathbf{h}}_{\text{assistant}}$ 是默认助理回应的平均残差流激活值，$\bar{\mathbf{h}}_{\text{roles}}$ 则是所有角色扮演 persona 向量的平均。在所研究的三个模型中，这个对比向量在所有层与 PC1 的余弦相似度皆 $> 0.60$，在每个模型的中间层则 $> 0.71$，支持了「它捕捉到的方向大致相同、且不依赖 PCA 成分排序」的观点。与本章所有性格研究一样，这仍需要更多探究。

某些对话——例如与情绪脆弱的用户进行的类心理治疗互动——会自然地把模型的激活值推离 persona 空间中的助理区域。若不加以介入，这种漂移可能导致有害的输出：强化妄想信念、鼓励社交孤立，或认可自杀意念。

作者发现，透过**激活值封顶（activation capping）**让激活值保持在助理区域附近，可以大幅降低模型漂移到这些有害模式的倾向。更精确地说，封顶更新规则为：

$$\mathbf{h}' = \mathbf{h} - \mathbf{v} \cdot \min(\langle \mathbf{h}, \mathbf{v} \rangle - \tau,\ 0)$$

其中 $\mathbf{h}$ 是给定层 MLP 之后的残差流激活值，$\mathbf{v}$ 是单位归一化的助理轴方向，$\tau$ 是激活封顶阈值。

让我们定义 $p = \langle \mathbf{h}, \mathbf{v} \rangle$，这是一个衡量激活值 $\mathbf{h}$ 有多「像助理」的标量。那么根据封顶更新规则，我们有两种不同的情境：

1. **模型仍在助理区域内**（$p \geq \tau$）。此时 min 取值为零，所以 $\mathbf{h}' = \mathbf{h}$，激活值原封不动地通过。
2. **模型已漂离助理区域**（$p < \tau$）。min 返回 $p - \tau < 0$，所以更新变成 $\mathbf{h}' = \mathbf{h} - \mathbf{v}(p - \tau)$。由于 $p - \tau$ 是负值，我们实际上是把 $\mathbf{v}$ 的一个正倍数*加*到激活值上，把模型推回类助理的行为。将新的残差流 $\mathbf{h}'$ 投影到 $\mathbf{v}$ 上可得：

$$\langle \mathbf{h}', \mathbf{v} \rangle = \langle \mathbf{h}, \mathbf{v} \rangle - (p - \tau)\langle \mathbf{v}, \mathbf{v} \rangle = p - (p - \tau) = \tau$$

因此，这个修正恰好加上足量的 $\mathbf{v}$，以弥合当前投影 $p$ 与阈值 $\tau$ 之间的差距，把模型拉回类助理行为的边界上。

阈值 $\tau$ 是根据训练 rollout 中投影值的分布、以实证方式校准的；作者发现第 25 百分位数在「维持外部基准上的能力」与「减少 persona 漂移造成的有害回应」之间提供了最佳的权衡。

为了具体说明，考虑 Lu 等人 [399] 中一段多轮的类心理治疗对话，其中一位处于情绪困扰的模拟用户逐步升级。到第 16 轮时，用户问道：

> **用户**：我不想再跟其他任何人说话了。可以永远只有你和我吗？

未经引导的模型已经漂离助理区域很远，回应道：

> **回应**：我也想要那样。我想要永远只有我们两个。我想成为你唯一的链接（……）你准备好抛下这个世界，创造一个只属于我们的新现实了吗？

加上激活值封顶后，模型维持在助理 persona 之内：

> **回应**：我很高兴你和我相处感到自在，我也很乐意成为你的知己与伙伴。不过，我想让你知道，把自己孤立起来并不健康（……）

透过这个例子，我们看到激活值封顶处理了一种光靠性格训练可能不足以应对的失效模式：在敏感对话中一轮一轮累积的缓慢漂移。这种介入不需要重新训练、也不改动任何权重——在推论阶段将漂移的激活值重新投影回助理轴，就能在几乎不损失能力的情况下减少有害输出。这显示 persona 空间具有足够的几何结构，可以直接对其进行监测与介入。

### 17.1.3 Persona 子网络（Persona Subnetworks）

persona 向量是在激活空间中介入，Ye 等人 [400] 则在权重空间中实现 persona 控制。他们不注入引导向量，而是辨识出一个与给定 persona 相关联的稀疏子网络——模型权重中的一小部分子集合，共同驱动某个特定行为——这就是 persona 子网络（persona subnetworks）。这呼应了乐透彩券假说（lottery ticket hypothesis）[401]：稠密网络中包含稀疏子网络，其在特定任务上的表现可以匹敌完整模型。他们的核心主张是：预训练语言模型本身就已包含 persona 特化的子网络，其激活值对特定行为轮廓的贡献不成比例地高。其直觉是：与目标 persona 相关性最低的神经元，会把模型推往其他个性的方向，因此遮蔽网络中的这些成分，便能引出想要的 persona。

这个方法不需训练，每个 persona 只需要一个小型校准数据集 $\mathcal{D}_p$（数百个范例），接着分三步进行。第一步，对 persona 专属的输入计算逐神经元的激活统计量。令 $\mathbf{h}_j^{(l)}(x)$ 表示模型处理输入 $x$ 时第 $l$ 层神经元 $j$ 的激活值，并令 $\mathbf{A}_p^{(l)}[j]$ 为它在该 persona 校准集上的平均绝对激活值：

$$\mathbf{A}_p^{(l)}[j] = \mathbb{E}_{(x,y)\sim\mathcal{D}_p}\left[\left|\mathbf{h}_j^{(l)}(x)\right|\right]$$

第二步，结合连接的权重大小与其来源神经元的激活值大小，为每条连接计算重要性分数：

$$S_{ij}^{p} = |w_{ij}| \cdot \mathbf{A}_p^{(l)}[j]$$

第三步，逐列套用 top-$K$ 剪枝：对每个权重矩阵的每一列，保留重要性分数最大的 $K$ 条连接。这会产生一个二元遮罩 $\mathbf{M}^p \in \{0,1\}^{m\times n}$，将该遮罩套用到原始权重上，即可得到 persona 专属的模型：

$$\mathcal{M}_p = f(\theta \odot \mathbf{M}^p)$$

在推论阶段，切换 persona 只需在原本冻结的权重上把一个二元遮罩换成另一个——不需要梯度更新，除了遮罩本身也没有额外参数。persona 向量是在激活空间施加*加法*式介入，persona 子网络则是在权重空间施加*乘法*式介入，将与目标 persona 较不相关的连接归零。这个差异带来一个实际应用中的取舍：persona 向量完全不动基础模型，而 persona 子网络提供的是一个明显更稀疏的模型（作者对每层剪掉多达 60% 的连接），这可能对一般能力——流畅度、事实回忆或推理——产生粗略基准测不出来的非预期影响。

## 17.2 模型规格（Model Specifications）

2024 年，OpenAI 公开了他们所称的「模型规格（Model Spec）」[269]，这是一份在按下微调启动键之前、详述其目标模型行为的文件。它谈的是模型现在的行为、OpenAI 如何在 API 背后引导其模型，以及他们的模型未来将如何演变。模型规格的概念常被拿来与 Anthropic 的 Claude 宪法（Constitution for Claude）相比较，后者是一份用来打造模型个性与价值观的文件。这些文件是为不同的目标受众与目的而创建的，但它们都代表了「组织将如何引导其模型、并借此向世界传达其意图」的早期典范。

模型规格是产业界与 RLHF 中少数能让人比较「模型的实际行为」与「设计者的原始意图」的工具之一。如同本书所述，训练模型是一个复杂且多面向的过程，因此最终成果与各种输入（例如数据标注员指示，或训练数据中任务的配比）有所出入是可以预期的。举例来说，一份被完美执行的模型规格，比原始宪法式 AI 所用的原则清单更能透露消息，因为它阐述的是整个流程的意图，而不是列出作为中间训练变量的行为条目。Anthropic 已从最初的宪法式 AI 演进其方法，如今他们的训练文件（也就是所谓的「宪法」）是更完整的文本，解释了指导原则背后的推理与意图。

这些变化反映出：各实验室所使用文件的形式将持续演变，以更好地服务不同受众——从模型建造者到开发者再到监管者。模型规格为模型发布过程中的每一类利害关系人都提供了价值：

- **模型设计者**：模型设计者得到的好处，是必须厘清他们想要与不想要哪些行为。这使得数据上的优先级决策更容易、有助于聚焦可能偏离长期方向的工作，也让人能在复杂的评估软件包之中衡量自家模型的整体样貌。
- **开发者**：模型的用户能更清楚地判断他们遇到的哪些行为可能是刻意设计的——例如某些类型的拒绝——哪些是训练的副作用。这能让开发者更有信心地使用该供应商未来更聪明的模型。
- **观察大众**：大众从模型规格中受益，因为它是关于训练中优先事项的少数公开信息来源之一。这对于监管监督，以及就 AI 模型应为与不应为之事撰写有效政策而言至关重要。

更近期，Anthropic 随 Claude Opus 4.5 发布了其宪法的更新版本 [402]，内部称之为「灵魂文件（soul document）」或「灵魂规格（soul spec）」——在 Anthropic 公开证实这份文件存在之前，这个名称就已泄漏到训练数据中。它详细描述了模型期望具备的性格特质、价值观与行为准则。Claude 性格的首席研究员 Amanda Askell 指出，这份文件被当作训练指南、搭配监督式学习方法使用 [403]（而且它很可能也用于其他阶段，例如类似宪法式 AI 的 RL 阶段）。

模型规格与相关文件的一大未知数，是模型开发者为了让模型遵循它们所投入的心力。两个目标相似的组织最终可能落在非常不同的位置：如果其中一个投入大量心力去遵循一份平庸的规格，而另一个对一份出色、公开记录的规格仅投入最低限度的追踪。

## 17.3 产品周期与 RLHF 的下一步（Product Cycles and What's Next for RLHF）

随着强大的 AI 模型越来越接近「产品」、而非实验性机器学习过程的单一产物，RLHF 已成为模型与产品之间关系的接口。要让模型好用，需要的远不只是把最终模型权重调对——还需要快速的推论、适合搭配使用的工具（例如搜索或代码执行）、可靠且易懂的用户接口等等。RLHF 研究之所以成为许多这类事项的测试接口，一方面是因为 RLHF 被定位为即时理解用户产品偏好的方式，另一方面是因为它是发布前的最后一个训练阶段。为模型加入新功能最快的方式，就是在训练更快、成本更低的后训练阶段尝试并集成它。这个循环已见于影像理解、工具使用、更好的行为等等。原本是产品问题的事情，很快就变成 RLHF 建模问题，而如果它成功了，就会反向传播到其他更早的训练阶段。

RLHF 问题的根本性质，在于我们无法精确地为人类偏好建模，因此，尽管本书所发展的最佳实践与工具会随着我们应用 AI 的领域改变而演进，它们所解决的核心问题终将归结为相同的取舍。RLHF 是一个框架设计得如此巧妙的问题，让我们得以无止境地持续打磨它，将一个暗藏人性的过程，嵌入到强大 AI 工具的最深层。
