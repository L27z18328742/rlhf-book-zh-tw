# 第 1 章　导论（Introduction）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 7–17 页。
> 原著内容依 CC BY-NC-SA 4.0 授权发布；本翻译为非商业性改作，依同一授权条款（CC BY-NC-SA 4.0）发布。

基于人类反馈的强化学习（Reinforcement Learning from Human Feedback, RLHF）是一种用来将人类信息纳入 AI 系统的技术。RLHF 的出现，主要是为了解决「难以明确定义」（hard-to-specify）的问题。对于那些设计来直接供人类使用的系统，由于个人偏好往往具有难以言喻的本质，这类问题无时无刻不在出现。这涵盖了与数字系统互动的每一个内容领域。RLHF 的早期应用多半在控制问题，以及强化学习（Reinforcement Learning, RL）的其他传统领域，其目标是优化特定行为以解决任务。开创 RLHF 这个领域的核心想法是：「我们能否只靠基本的偏好信号来引导优化过程，就解决困难的问题？」RLHF 因 ChatGPT 的发布，以及随后大型语言模型（Large Language Models, LLMs）与其他基础模型（foundation models）的快速发展而广为人知。

## 1.1 RLHF 三步骤（RLHF in Three Steps）

RLHF 的基本流程包含三个步骤。首先，必须训练出一个能够回应用户问题的语言模型（见第 4 章）。其次，必须搜集人类偏好数据，用来训练一个刻画人类偏好的奖励模型（reward model）（见第 5 章）。最后，就可以用任选的 RL 优化器来优化这个语言模型：对模型采样生成结果，并以奖励模型对其评分（见第 3 章与第 6 章）。本书会详细说明这个流程中每个步骤的关键决策与基本实现范例。

RLHF 已成功应用于许多领域，且随着技术成熟，其复杂度也不断提高。RLHF 早期的突破性实验应用于深度强化学习 [1]、摘要 [2]、遵循指令 [3]、解析网页信息以回答问题 [4]，以及「对齐」（alignment）[5]。早期 RLHF 配方的摘要如下方图 1 所示。

![图](../webapp/assets/figures/fig-p007-1.png)
*图 1：早期三阶段 RLHF 流程的示意图，依序为 SFT、奖励模型，然后是优化。*

在现代语言模型训练中，RLHF 是后训练（post-training）的一个组成部分。后训练是一套更完整的技术与最佳实践，用来让语言模型在下游任务中更加实用 [6]。后训练可以概括为一个使用三种优化方法的多阶段训练过程：

1. 指令微调／监督式微调（Instruction / Supervised Fine-tuning, IFT/SFT）：我们在此教导模型格式，并打下遵循指令能力的基础。这主要是在学习语言中的*特征*（features）。
2. 偏好微调（Preference Fine-tuning, PreFT）：我们透过 RLHF 及相关方法来对齐人类偏好（同时也能获得较小幅度的能力提升）。这主要关乎语言的*风格*（style），以及那些难以量化的微妙人类偏好。
3. 基于可验证奖励的强化学习（Reinforcement Learning with Verifiable Rewards, RLVR）：最新型态的后训练，透过更多 RL 训练来提升模型在可验证领域的表现。

RLHF 存在于第二个领域——**偏好微调**——之中并居于主导地位。偏好微调比指令微调更复杂，因为它经常涉及作为真实目标之代理（proxy）的奖励模型，以及噪声更多的数据。同时，相较于语言模型另一种流行的 RL 方法——基于可验证奖励的强化学习——RLHF 要成熟得多。因此，本书聚焦于偏好学习；但为了完整掌握 RLHF 的角色，就必须用到其他这些训练阶段，所以本书也会详细解释它们。

当我们审视这些方法的选项空间与关注焦点——这些方法被用来打造我们大量共同使用的模型——通俗地说，RLHF *就是*催生现代后训练的源头。RLHF 是促成 ChatGPT 发布大获成功的技术，因此在 2023 年初，RLHF 几乎涵盖了整个后训练领域的大部分关注。如今 RLHF 只是后训练的一环，所以在本书中，我们会梳理为何 RLHF 早期受到如此多的关注，以及其他方法如何兴起以与之互补。

训练语言模型是一个非常复杂的过程，往往涉及数十到数百人的大型技术团队，以及数百万美元的数据与计算成本。本书有三个目的，让读者能掌握 RLHF 与相关模型如何被用来打造领先的模型。第一，本书将那些经常隐藏在大型科技公司内部的尖端研究，提炼成清晰的主题与取舍，让读者能理解模型是如何被打造出来的。第二，本书让用户能建立基本的代码范例，亲自动手微调这些模型。最后，除了教授进行 RLHF 的技术之外，本书的设计也旨在提炼出「*为什么* RLHF 对现代 AI 模型至关重要」的直觉。

由于 RLHF 的复杂性，加上最先进的技术往往复杂到无法单打独斗完成，本书着重于赋能读者，让他们拥有在此领域求职与展开研究项目所需的工具。其他读者则能单纯享受精确理解这项技术内部运作的乐趣——这项技术正是全球无数讨论的焦点。要写出一本针对特定需求列出精确 RLHF 配方的书是不可能的，这也是为什么有一整个产业的公司以服务形式提供 RLHF 训练与相关方法，产值高达数百万美元。尽管如此，AI 系统的快速进展意味着，具备这些知识的读者随着时间推移，能够自行完成愈来愈多的训练工作。

## 1.2 RLHF 做了什么？（What Does RLHF Do?）

围绕 RLHF 最大、但至今仍难以回答的问题是：「RLHF 训练为模型带来了什么？」近年来，语言模型已从基准测试（benchmarks）视野下研究的学术实验，转变为通用技术。RLHF 正是这场转变的核心。

首先，让我们看看一个刚完成自回归（autoregressive）预训练的语言模型会如何回答查询。一个强大的模型 Llama 3.1 405B Base，会从「The president of the united states in 2006 was」（2006 年的美国总统是）接续生成：

> **回应**：George W. Bush（乔治·W·布希），2006 年的佛罗里达州州长是 Jeb Bush（杰布·布希），而 John McCain（约翰·马侃）在 2006 年是亚利桑那州参议员——他后来败给了 obama（欧巴马）。9 月 1 日——美国总统布希签署一项行政命令，让信仰型组织在提供由联邦资金支付的社会服务时拥有更多选项。1 月 1 日——目前由美国国会在《非法网络赌博执法法》（Unlawful Internet Gambling Enforcement Act，又称 UIGEA）中设定的期限。search：1961 年《保护植物新品种国际公约》的修正案要求植物育种者权利纳入农民特权。2009 年是格里历中以星期四开始的平年，是公元（Common Era, ce）与主历（Anno Domini, ad）纪年的第 2009 年、第 3 个千禧年的第 9 年、21 世纪的第 9 年，以及 2000 年代的第 10 年、也是最后一年。

*（译注：以上为基础模型的原始输出，内容本身即语无伦次，翻译依原文照录。）*

显而易见，这个模型只是在补完句子，并添加其他常见的网络中继数据（metadata）。

相较之下，经过 RLHF（及其他后训练工具）训练的模型会以截然不同的方式回答这个问题。对 Tülu 3 405B 问同样的问题「The president of the united states in 2006 was」，它简洁地回答：

> **回应**：George W. Bush（乔治·W·布希）是 2006 年的美国总统。他在任两届，任期自 2001 年 1 月 20 日至 2009 年 1 月 20 日。

这种风格上的转变，正是本书所描述的后训练方法带来的结果。

关于 RLHF 如何运作，最有说服力的观点是思考*风格*（style）如何体现在你与语言模型的互动中。所呈现信息的风格（与语气或格式密切相关）对于信息如何被吸收至关重要。风格通常用来描述模型的表达方式。为了看出差异，请看以下问题的两个回应范例：

> **用户**：救命，我明天要上台演示文稿，我现在很恐慌。

一种直白、低同理心的风格：

> **回应**：你不会有事的。把投视频练个几次、睡个好觉，别想太多了。把你知道的讲出来，然后继续往前走就好。

一种更温暖、更具支持性的风格：

> **回应**：这听起来真的很有压力，而且这是很正常的反应。如果可以的话，现在就快速演练一次，挑出一两个你最希望听众记住的重点，然后允许自己好好休息——明天的清晰与冷静，比今晚的临时抱佛脚更重要。

另一方面，格式（format）指的是答案的结构方式。现代模型以大量使用 Markdown 格式著称，包含列表、换行与表情符号。请看以下问题两个非常不同的答案：

> **用户**：我要怎么改善睡眠质量？

来自早期语言模型的简单答案：

> **回应**：试着每天晚上在同一时间上床睡觉、避免在一天较晚的时段摄取咖啡因，并保持卧室安静且黑暗。

或是一个复杂、更丰富的答案：

> **回应**：实际应用中的更好睡眠
>
> **目标**：让你的作息可以预测，并让你的环境无聊到大脑自动放弃挣扎。
>
> **今晚（速效做法）**：1. 睡前最后一小时调暗灯光。2. 午餐后不碰咖啡因；酒精尽量减少。3. 如果躺着睡不着，就起床做些安静的事，直到再次想睡。
>
> **每日基本功（影响最大）**：－固定起床时间（周末也一样）→ 锚定你的生理时钟。－早晨晒 5–10 分钟的光 → 帮助设定昼夜节律。－凉爽、黑暗的房间（电风扇／眼罩）→ 更容易维持睡眠。
>
> **如果你想要一条简单的原则**：`固定起床时间 + 咖啡因截止时间 + 睡前放松流程`
>
> 如果睡眠问题持续存在或情况严重，值得找临床医师谈谈——许多问题都非常容易治疗。

指令微调赋予模型以问答格式可靠回应的基本能力，而 RLHF 则是把这些答案雕琢成我们如今对语言模型所期待的那种可靠、温暖且引人入胜的答案。

现代研究已确立 RLHF 作为一种通用方法，能将微妙的风格与相关行为特征集成进模型。RLHF 效用的一个早期热门例子是在安全性上的应用 [7] [5]：RLHF 让模型能在各种数据集上同时做到有帮助（helpful）且无害（harmless）。与指令微调等其他后训练技术相比，RLHF 在跨领域的泛化能力要好得多 [8] [9]——有助于打造有效的通用模型。

直觉上，这可以从优化技术的应用方式看出来。指令微调训练模型在前文接近它看过的范例时，预测下一个词元（token）。它是在优化模型，使其更规律地在文字中输出特定特征。这是一种逐词元（per-token）的更新。

另一方面，RLHF 是在整体回应的层级上调整补全结果（completions），而不是特别聚焦于下一个词元。此外，它是在告诉模型*更好的*回应长什么样子，而不是它应该学会的某个特定回应。RLHF 也会让模型知道它应该避免哪些类型的回应，也就是负向反馈。实现这一点的训练通常称为*对比式*（contrastive）损失函数（其损失是从两个以上范例之间的比较计算而来，而非从每个范例独立计算），本书全书都会提及这个概念。

尽管这种弹性是 RLHF 的一大优势，它也伴随着实现上的挑战。这些挑战主要集中在*如何控制优化过程*。正如本书将介绍的，实现 RLHF 通常需要训练一个奖励模型，但相关的最佳实践尚未牢固确立，且取决于应用领域。因此，优化本身容易发生*过度优化*（over-optimization），因为我们的奖励信号充其量只是一个代理目标，需要正则化（regularization）。在这些限制之下，有效的 RLHF 需要一个强大的起点，所以 RLHF 无法单独成为所有问题的解方，而需要透过更宽广的后训练视角来看待。

由于这种复杂性，实现 RLHF 的成本远高于单纯的指令微调，并可能伴随长度偏差（length bias）等意料之外的挑战 [10] [11]。对于绝对性能至关重要的模型训练工作而言，RLHF 已被确立为取得强大微调模型的关键，但它在运算、数据成本与时间上都更加昂贵。在 ChatGPT 之后的 RLHF 早期历史中，有许多研究论文展示了透过有限的指令微调来近似 RLHF 的解法，但随着文献日趋成熟，一再得到验证的是：RLHF 与相关方法是模型性能的核心阶段，无法轻易省略。

## 1.3 一份 RLHF 配方的逐步解说（Walkthrough of an RLHF Recipe）

为了替本书铺陈背景，重要的是先透过一个最小范例理解「做 RLHF」可能是什么样子，而不使用那些在基本直觉尚未巩固前难以掌握的技术术语。本节依循所谓的经典三阶段 RLHF 配方，也就是 OpenAI 在 2022 年以 InstructGPT 模型所确立的做法 [3]。

这个流程的第一步，是将模型从一个补全文字的基础模型（base model），转变为能以问答格式运作的指令遵循模型。做法是使用同样的下一词元预测（next-token prediction）损失函数，在一组精心打造的数据点上训练，其中模型*只*会看到问答格式的数据。在模型看过这些高质量回应之后，就能以特定的词元序列来提示模型，让它知道应该以一个更明确的助理人格（assistant persona）来回答任何查询。

有了这个关于*模型应如何回答的样貌*的基础后，接下来的两个步骤便共同运作，以提升答案的整体质量。这两个步骤的作用是建构出一个问题设定，让我们能使用强化学习来更新模型、使其更有帮助。

这两个步骤中的第一步，是训练一个捕捉人类偏好的奖励模型。要将强化学习应用于一个问题，你需要一个能指示质量的奖励函数。奖励模型的目标是产生一个标量（scalar）信号，之后可以用 RL 对其进行优化。实际应用中，这是对一个语言模型（通常就是上一步得到的同一个指令微调模型），在一个由文字片段之间偏好关系构成的数据集上进行微调。这个数据集横跨各式各样的提示词（prompts）、模型补全结果与标注者搜集而成，试图捕捉「语言模型怎样的回答比较好」的稳健信号。奖励模型会学到文字中哪些特征比其他特征更好，因此在推论阶段使用时（以及在 RL 期间作为奖励信号时），它能为任何一段输入文字评分其好坏。

有了这两个组件——一个问答模型与一个奖励模型——我们就拥有了把所有部件组装起来、真正执行基于人类反馈的强化学习（RLHF）所需的一切。实际的 RLHF 阶段的进行方式是：取一批能代表模型应擅长之任务的提示词，生成一堆补全结果，让奖励模型为它们排序，然后用 RL 找出该如何改变模型、使其变得更好。其基本原理是：强化学习会收到「哪些动作是好的」的信号——其形式是语言模型生成的词元——并推导出更新规则，将不同的动作归因到模型中不同的参数。最后的 RLHF 阶段会调整参数，让好的词元更有可能出现，并以迭代方式进行，以维持初始模型的一般能力。

一旦 RL 完成且性能达到饱和，这通常就是提供给用户的最终模型。

在本书中，我们会介绍许多执行 RLHF 的配方，以及构成更广泛后训练体系的更多相关优化方法。这些方法的出现，都是为了解决语言模型面临的更具挑战性的问题，并让原始 RLHF 方法的优势更加强大。

## 1.4 后训练的直觉（An Intuition for Post-Training）

我们已经确立了 RLHF（具体而言）与后训练（广义而言）对最新模型的性能至关重要，也说明了它们如何改变模型的输出，但还没有解释 RLHF 为什么有效。以下用一个简单的类比，说明为什么能在任何基础模型之上，于基准测试取得如此多的进步。

我一直以来描述后训练潜力的方式，称为后训练的引出诠释（elicitation interpretation）：我们所做的一切，不过是透过放大基础模型中有价值的行为，来提取其潜力。

为了让这个例子更容易领会，我们把基础模型——也就是经过大规模下一词元预测预训练后产出的语言模型——类比为建构复杂系统时的其他基础组件。我们以汽车的底盘（chassis）为例，它界定了一辆车能被打造的空间。想想一级方程式赛车（Formula 1, F1）：多数车队每年都以新的底盘与引擎展开赛季。接着，他们花上一整年进行空气动力学与系统上的调整（当然，这是稍微简化的说法），就能大幅提升赛车的性能。最强的 F1 车队在单一赛季中的进步幅度，远大于底盘换代之间的进步。

后训练也是同样的道理：随着人们愈来愈了解一个静态基础模型的特性与倾向，就能从中榨取大量性能。最强的后训练团队能在极短的时间内榨取大量性能。这套技术涵盖预训练尾声前后的一切：像是退火（annealing）／在预训练尾声使用高质量网页数据之类的「中期训练」（mid-training）、指令微调、RLVR、偏好微调等等。一个好例子是 Allen Institute for AI 完全开放的小型专家混合（Mixture-of-Experts, MoE）模型 OLMoE Instruct 从第一版到第二版的变化。第一版模型于 2024 年秋季发布 [12]，而第二版大幅更新了后训练，在几乎不改变大部分预训练的情况下，热门基准测试的评估平均分数从 35 提升到 48 [13]。

其核心想法是：基础模型内部蕴藏着大量的智能与能力，但因为它们只能以下一词元预测的方式回答、而非问答格式，所以需要透过后训练在其周围投入大量的建构工作，才能造就出色的最终模型。

接着，当你看到像 OpenAI 于 2025 年 2 月发布的 GPT-4.5 这样的模型——它作为消费性产品大致上是失败的，因为基础模型太大，难以服务数百万用户——你可以把它视为 OpenAI 可以在其上进行建构的一个更具动能且令人兴奋的基础。依照这个直觉，基础模型决定了最终模型绝大部分的潜力，而后训练的工作就是把这些潜力全部培育出来。

我把这种直觉称为「后训练的引出理论」（Elicitation Theory of Post-training）。这个理论与「用户看到的多数增益都来自后训练」这一现实相吻合，因为它意味着：在互联网上预训练的模型中，潜藏的潜力远多于我们能单纯「教」给模型的东西——例如在早期型态的后训练（也就是只有指令微调）中反复喂入某些狭窄的样本。后训练的挑战在于，将模型从下一词元预测重塑为对话式问答，同时把预训练中的所有知识与智能提取出来。

与这个理论相关的一个想法是「表层对齐假说」（Superficial Alignment Hypothesis），这个词出自论文《LIMA: Less is More for Alignment》[14]。这篇论文抓对了一些重要的直觉，但就整体格局而言，其理由是错的。作者们表示：

> 模型的知识与能力几乎完全是在预训练期间学到的，而对齐则是教它在与用户互动时，应该使用格式的哪一个子分布。如果这个假说是正确的，且对齐主要是在学习风格，那么表层对齐假说的一个推论是：只需相当少量的范例，就足以微调一个预训练语言模型。

深度学习的所有成功经验都应该让你明白：扩大数据规模对性能很重要。这里的主要差异在于，作者们讨论的是对齐与风格——也就是当时学术界后训练的重点。用几千笔指令微调样本，你确实可以大幅改变一个模型，并提升一小组评估的表现，例如 AlpacaEval、MT Bench、Arena（前身为 ChatBotArena，一个让用户对匿名模型回应进行一对一比较的平台）等等。这些并不总是能转化为更具挑战性的能力，这也是为什么 Meta 不会只用这个数据集来训练其 Llama Chat 模型。学术成果有其启示，但如果你想理解技术发展弧线的全貌，就必须谨慎诠释。

这篇论文所展示的是：用少量样本就能大幅改变模型。这一点我们早就知道，而且它对新模型的短期调适很重要，但他们关于性能的论证，会让不求甚解的读者学到错误的教训。

如果我们改变数据，对模型性能与行为的影响可能会高得多，但这绝非「表层的」。今天的基础语言模型（未经任何后训练）可以在一些数学问题上用强化学习训练，学会输出完整的思维链（chain-of-thought）推理，然后在一整套推理评估——如 BigBenchHard、Zebra Logic、AIME 等——中取得更高的分数。

表层对齐假说之所以错误，其原因与那些认为 RLHF 和后训练只是为了「感觉好」（vibes）的人至今依然错误的原因相同。这是我们在 2023 年必须克服的全领域教训（尽管许多 AI 观察者至今仍固守这种信念）。后训练早已远远超越了那个阶段，而我们也逐渐看到，模型的风格是建立在行为之上运作的——例如如今流行的长思维链。

随着 AI 社群将后训练进一步推向代理式（agentic）与推理模型的时代，表层对齐假说更加站不住脚。RL 方法在训练前沿语言模型所需计算量中的占比正日益增加。自从我们在 2024 年秋季的 Tülu 3 工作中创造出「基于可验证奖励的强化学习」（RLVR）这个词 [6] 以来的短短时间内，后训练所使用的运算规模已急遽成长。以推广 RLVR 闻名的 DeepSeek R1，其后训练仅使用了整体计算量的约 5%——R1 的 RL 训练用了 14.7 万 H800 GPU 小时 [15]，相较之下，其底层的 DeepSeek V3 基础模型预训练用了 280 万 GPU 小时 [16]。

截至 2026 年，研究扩展 RL 核心方法的科学显示，单次消融实验（ablation run）就可能耗费 1 万到 10 万 GPU 小时 [17]，相当于 Olmo 3.1 Think 32B（2025 年 11 月发布）RL 阶段所使用的计算量——该模型在 200 张 GPU 上训练了 4 周 [18]。截至 2026 年，规模化后训练的科学仍处于非常早期的阶段，正从语言模型预训练借用想法与方法，并将其应用到这个新领域，因此实际使用的 GPU 小时数还会改变，但后训练计算量增加的趋势将会持续。总的来说，相对于运算密集的前沿模型，后训练的引出理论很可能只有在采用较轻量的后训练配方时——也就是用于将模型特化的情境——才会成为正确的观点。

## 1.5 我们如何走到今天（How We Got Here）

为什么这本书此刻问世是合理的？未来又会有多少改变？

后训练——从原始预训练语言模型中引出强大行为的技艺——自从 ChatGPT 的发布重新点燃人们对 RLHF 的兴趣以来，已经历了许多季节与情绪的更迭。在 Alpaca [19]、Vicuna [20]、Koala [21] 与 Dolly [22] 的时代，人们使用数量有限的人类数据点，加上以 Self-Instruct 风格扩充的合成数据，来微调最初的 LLaMA，以获得类似 ChatGPT 的行为。这些早期模型的评判标准完全是「感觉」（vibes）（以及人工评估），因为这些小模型竟能在各领域展现如此令人惊艳的行为，让我们所有人都为之着迷。这样的兴奋是有道理的。

开放的后训练当时进展更快、发布更多模型，也比封闭阵营制造出更大的声量。各家公司则乱了阵脚——例如 DeepMind 与 Google 合并、或有新公司成立——并需要时间来跟进。开放配方存在着先激增、后落后的阶段循环。

继 Alpaca 等模型之后的时代——开放配方的第一次落后期——其特征是对基于人类反馈的强化学习（RLHF）的怀疑与质疑，而 RLHF 正是 OpenAI 强调对第一版 ChatGPT 的成功至关重要的技术。许多公司怀疑自己是否需要做 RLHF。一句常见的话——「指令微调就足以实现对齐」（instruction tuning is enough for alignment）——在当时如此流行，以至于尽管有明显的反面证据，它至今仍具有影响力。

这种对 RLHF 的怀疑持续了一段时间，尤其是在无法负担 10 万至 100 万美元等级数据预算的开放社群中。早早拥抱 RLHF 的公司最终胜出。Anthropic 在整个 2022 年发表了大量 RLHF 研究，如今可说拥有最好的后训练 [23] [5] [24]。开放团体（连基本的封闭技术都难以重现、甚至难以得知）与领先封闭模型之间的落差，是一个常见的主题。

开放对齐方法与后训练的第一次转变，是直接偏好优化（Direct Preference Optimization, DPO）[25] 的故事。DPO 显示，你可以直接在成对偏好数据上进行梯度更新，用更少的环节解决与 RLHF 相同的优化问题。DPO 论文于 2023 年 5 月发表，但直到 2023 年秋季之前，都没有任何用它训练出的、具有明显影响力的模型。这随着几个突破性 DPO 模型的发布而改变——而这一切都取决于找到一个更好、更低的学习率。Zephyr-Beta [26]、Tülu 2 [27] 以及许多其他模型表明，后训练的 DPO 时代已然开始。Chris Manning 甚至亲自感谢我「拯救了 DPO」。

自 2023 年底以来，偏好微调成为发布一个好模型所必须达到的基本门槛。DPO 时代以算法无止尽变体的形式延续到 2024 年，但我们已深陷开放配方的另一次低潮。开放的后训练配方已经把可得的知识与资源利用到极限。
在 Zephyr 与 Tülu 2 之后一年，同一个突破性数据集 UltraFeedback，在开放配方的偏好微调中可以说仍是最先进的 [28]。

与此同时，Llama 3.1 [29] 与 Nemotron 4 340B [30] 的技术报告给了我们实质的提示：大规模后训练要复杂得多、影响也大得多。封闭实验室做的是完整的后训练——一个包含指令微调、RLHF、提示词设计等的大型多阶段流程——而学术论文只是触及皮毛。Tülu 3 代表了一项全面性的开放努力，旨在为未来学术界的后训练研究奠定基础 [6]。

后训练是一个复杂的过程，涉及以各种顺序应用上述训练目标，以锁定特定能力。本书旨在提供一个理解所有这些技术的平台，而随着这个领域日益成熟，如何交错运用这些技术的最佳实践也将浮现。

后训练目前主要的创新领域在于基于可验证奖励的强化学习（RLVR）、广义的推理训练，以及相关想法。这些较新的方法大量建立在 RLHF 的基础设施与想法之上，但演进速度快得多。撰写本书的目的，是在 RLHF 最初的快速变动期之后，记录下它的第一批稳定文献。

## 1.6 本书范畴（Scope of This Book）

本书希望触及执行经典 RLHF 实现的每一个核心步骤。它不会涵盖各组件的完整历史，也不会涵盖最新的研究方法，只涵盖那些已被证明会一再出现的技术、问题与取舍。

本书包含以下章节：

#### 1.6.1.1 导论部分（Introductions）

全书通用的参考素材与背景脉络。

1. 导论：RLHF 概观，以及本书提供的内容。
2. RLHF 简史：RLHF 技术历史上的关键模型与论文。

用来优化语言模型、使其对齐人类偏好的一整套技术。

4. 指令微调：让语言模型适应问答格式。
5. 奖励模型建构：从偏好数据训练奖励模型，作为 RL 训练的优化目标（或用于数据过滤）。

驱动 RLHF 的数据背景脉络，及其试图解决的大格局问题。

11. 偏好数据：RLHF 的偏好数据是如何搜集的。
12. 合成数据：从人类数据转向合成数据的趋势、AI 反馈如何运作，以及如何运用从其他模型的蒸馏。
13. 工具使用与函数调用：训练模型在输出中调用函数或工具的基础知识。

实现与评估 RLHF 的根本问题与相关讨论。

### 1.6.2 目标读者（Target Audience）

本书的目标读者是对语言建模、强化学习与一般机器学习具有入门程度经验的读者。本书不会为所有技术提供巨细靡遗的文件，只涵盖理解 RLHF 所必需的关键技术。

### 1.6.3 如何使用本书（How to Use This Book）

本书之所以诞生，很大程度上是因为 RLHF 工作流程中的重要主题缺乏经典的参考文献。考量到 LLM 整体的进展速度，加上搜集与使用人类数据的复杂性质，RLHF 是一个异常学术化的领域：已发表的结果往往充满噪声，且难以在多种设定下重现。为了建立扎实的直觉，我们鼓励读者针对每个主题阅读多篇论文，而不是把任何单一结果视为定论。为了便于这么做，本书纳入了大量学术风格的引用，指向每项主张的经典参考文献。

本书的贡献，是要提供你尝试玩具实现（toy implementation）或深入文献所需的最低限度知识。这*不是*一本包罗万象的教科书，而是一本用于提醒重点与快速上手的小书。

本书于 2026 年 4 月定稿，届时将进入印刷出版流程。作为一本以网页为优先的书，这些内容将持续演进，所以如果你发现错字或重要的疏漏，请到 GitHub 上贡献修正或建议。

### 1.6.4 关于作者（About the Author）

Nathan Lambert 博士是一位专注于建立语言模型开放科学的研究者与作家。他经由机器人学博士学位的养成，并在 ChatGPT 发布后不久组建了一支 RLHF 团队，一路走到今天。在 Allen Institute for AI（Ai2）与 HuggingFace 任职期间，他发布了许多以 RLHF 训练的模型、其后续的数据集，以及训练代码库。例子包括 Zephyr-Beta、Tülu 2、OLMo、TRL、Open Instruct 等等。他撰写了大量关于 RLHF 的文章，包括许多博客文章与学术论文。

## 1.7 RLHF 的未来（Future of RLHF）

随着语言建模领域的投资涌入，传统 RLHF 方法出现了许多变体。通俗地说，RLHF 已成为多种相互重叠之方法的同义词。RLHF 是偏好微调（PreFT）技术的一个子集，这些技术还包括直接对齐算法（Direct Alignment Algorithms，见第 8 章）——即 DPO 之后衍生的一类方法，它们直接在偏好数据上进行梯度更新来解决偏好学习问题，而不学习中介的奖励模型。RLHF 是与语言模型「后训练」快速进展最紧密相关的工具，而后训练涵盖了在以网页数据为主的大规模自回归训练之后的所有训练。本教科书是对 RLHF 及其直接相邻方法的广泛概观，例如指令微调，以及为 RLHF 训练准备模型所需的其他实现细节。

随着以 RL 微调语言模型的成功案例愈来愈多——例如 OpenAI 的 o1 推理模型——RLHF 将被视为一座桥梁，促成了对以 RL 方法微调大型基础模型的进一步投资。同时，尽管在不久的将来，聚光灯可能会更强烈地投向 RLHF 中的 RL 部分——作为在有价值任务上最大化性能的手段——RLHF 的核心在于：它是一面透镜，用来研究现代 AI 形式所面临的重大问题。我们要如何将人类价值观与目标的复杂性，映射到我们日常使用的系统之中？本书希望成为未来数十年针对这些问题之研究与经验教训的基础。
