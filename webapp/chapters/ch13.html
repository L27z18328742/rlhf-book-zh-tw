# 第 13 章　工具使用与函数调用（Tool Use and Function Calling）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 159–167 页。

让语言模型使用工具，是扩充其能力的自然途径，特别是在信息存在于外部工具中的高精度任务，或是需要与复杂网络系统互动的代理（agent）场景。工具使用（tool-use）是语言模型需要透过训练习得的技能，而 RLHF 以及本书介绍的所有其他方法都能加以精进。试想用户提出这样的问题：

> **User**：今天的总统是谁？

没有工具的语言模型会因为预训练数据的知识截止日期（knowledge cutoff）而难以回答这个问题，但只需一次搜索查询就能轻易取得这项信息。再看另一个例子：

> **User**：把我下载文件夹里所有的 arXiv 论文移到我的 ~/research/ 目录，并以文件名标示论文的日期。

这是一项单靠模型权重根本无从着手的任务——工具的使用让语言模型得以处理范围远为广泛的任务。

在深入探讨之前，先厘清几个经常被混用的相关术语会很有帮助：

- **工具使用（tool use）**：模型输出一个结构化的请求（工具名称与参数）；由编排器（orchestrator）执行该工具；结果被附加到上下文中；模型接着继续生成。
- **函数调用（function calling）**：一种工具使用的形式，其中参数必须符合一组函数的声明式结构描述（schema，通常是 JSON Schema），使得剖析与验证得以可靠进行。
- **代码执行（code execution）**：工具使用的一种特例，其中的「工具」是代码解释器（例如 Python）；结果以工具输出的形式返回。

## 13.1 工具使用概观（Tool-Use Overview）

AI 模型透过输出特殊词元（token）来触发特定端点（endpoint），借此使用任何外部工具。这些工具可以是高度特定的功能，例如返回特定地点天气的函数，也可以是作为复杂行为基础建构组件的代码解释器或搜索引擎。我们的第一个例子展示了语言模型需要更即时的信息，来弥补其权重基于过往数据训练而固定不变的本质；但也有像代码执行这样的工具，让语言模型能够绕过其概率式、生成式的天性，返回精确的答案。想想这个任务：印出圆周率的近似值到小数点后 50 位（而不是凭记忆背诵并冒着幻觉的风险）。具备工具的语言模型可以这样做：

```
<code>
from decimal import Decimal, getcontext
getcontext().prec = 60

def compute_pi():
    # Chudnovsky algorithm for computing pi
    C = 426880 * Decimal(10005).sqrt()
    K, M, X, L, S = 0, 1, 1, 13591409, Decimal(13591409)
    for i in range(1, 100):
        M = M * (K**3 - 16*K) // ((i)**3)
        K += 12
        L += 545140134
        X *= -262537412640768000
        S += Decimal(M * L) / X
    return C / S

print(str(compute_pi())[:52])
</code>

<output>
3.14159265358979323846264338327950288419716939937510
</output>
```

本章将概述现代语言模型中工具使用的起源、其基本原理与格式，以及当前领先模型在善用工具上的取舍。

「工具使用」一词的确切起源并不清楚，但这个概念的源头远早于 RLHF 蓬勃发展的后 ChatGPT 时代。早在 2015 年左右，就有人尝试建构早于现代语言模型的系统，例如神经编程解释器（Neural Programmer-Interpreters, NPI）[329]——「一种能学习表征并执行程序的循环且具组合性的类神经网络」。随着语言模型日益普及，许多子领域开始集成外部能力以提升性能。为了取得权重之外的信息，许多研究采用检索增强生成（retrieval augmented generation, RAG）[330] 或网页浏览 [4]。不久之后，其他研究者也开始探索让语言模型与程序 [331] 或工具 [332] 集成。

随着领域逐渐成熟，除了底层语言建模能力的大幅提升之外，这些模型也获得了更复杂的能力。例如 Toolformer 可以使用「一个计算机、一个问答系统、两个不同的搜索引擎、一个翻译系统与一个行事历」[333]。不久后，Gorilla 被训练来使用 1645 个 API（来自 PyTorch Hub、TensorFlow Hub v2 与 Hugging Face），其评测基准 APIBench 成为知名的柏克莱函数调用排行榜（Berkeley Function Calling Leaderboard）的基础 [334]。自这些早期模型以来，可调用动作的多样性已大幅成长。

如今，工具使用模型已与日常的语言模型互动深度交织。模型上下文协定（Model Context Protocol, MCP）作为一种将语言模型连接到外部数据源（或工具）的通用格式应运而生 [335]。随着模型更强、格式更佳，工具使用语言模型被应用于许多情境，包括 Microsoft Office 或 Google Workspace 等热门应用程序内的生产力副驾（copilot）、科学领域 [336]、医疗领域 [337]、程序编写代理（coding agent）[338]（如 Claude Code 或 Cursor）、与数据库的集成，以及许多其他自主工作流程。

评估工具使用模型涉及多个面向：工具名称与参数正确性的精确匹配（exact-match）指标、结构描述有效性，以及在模拟环境中端到端的任务完成度。跨多次尝试的可靠性也很重要——$\tau$-bench 提出了 $\text{pass}^k$ 指标（有别于 pass@k），用来衡量代理是否能「稳定地」成功，而非仅是「偶尔」成功 [339]。ToolLLM 及其 ToolBench 数据集提供了一个大规模框架，用于在超过 16,000 个真实世界 API 上训练与评估工具使用 [340]；而柏克莱函数调用排行榜（Berkeley Function Calling Leaderboard, BFCL）至今仍是比较各模型函数调用准确度的热门基准 [334]。

## 13.2 在生成过程中交织工具调用（Interweaving Tool Calls in Generation）

函数调用的训练数据看起来与其他后训练（post-training）数据非常相似，只多了一项：一个告知模型有哪些工具可用的系统提示（system prompt）。以下是一个格式化后的范例数据点，包含系统提示与以 JSON 格式提供的可用工具：

```
<system>
You are a function-calling AI model. You are provided with function signatures within
<functions></functions> XML tags. You may call one or more functions to assist with the
user query. Don't make assumptions about what values to plug into functions.
</system>

<functions>
[
  {
    "name": "search_movies",
    "description": "Search for movies by title and return matching results with IDs.",
    "parameters": {
      "type": "object",
      "properties": {
        "query": {
          "type": "string",
          "description": "The search string for the movie title."
        }
      },
      "required": ["query"]
    }
  },
  {
    "name": "get_movie_details",
    "description": "Fetch detailed information about a movie including cast, runtime,
and synopsis.",
    "parameters": {
      "type": "object",
      "properties": {
        "movie_id": {
          "type": "string",
          "description": "The unique identifier for the movie."
        }
      },
      "required": ["movie_id"]
    }
  },
  {
    "name": "get_showtimes",
    "description": "Get movie showtimes for a given location and date.",
    "parameters": {
      "type": "object",
      "properties": {
        "movie_id": {
          "type": "string",
          "description": "The unique identifier for the movie."
        },
        "zip_code": {
          "type": "string",
          "description": "ZIP code for theater location."
        },
        "date": {
          "type": "string",
          "description": "Date for showtimes in YYYY-MM-DD format."
        }
      },
      "required": ["movie_id", "zip_code"]
    }
  }
]
</functions>

<user>
...
</user>
```

虽然语言模型正在生成一段补全（completion），但若它遵循此范例，它会生成 `search_movies("Star Wars")` 这些词元来搜索《星际大战》。这通常会被编码在特殊的格式化词元之中，接着插入序列的下一批词元将包含工具的输出。借此，模型能学会完成比许多单纯的独立模型更具挑战性的任务。

一种流行的工具使用形式是代码执行（code-execution），让模型能够对复杂的逻辑或数学问题取得精确答案。举例来说，语言模型执行过程中的代码执行，可以发生在推理模型（reasoning model）的思考词元（thinking tokens）之中。与函数调用一样，先有标记要执行的代码的标签（由模型生成），然后是另一个独立的输出标签。

```
<|user|>
What is the 50th Fibonacci number? (Use the standard F_0=0, F_1=1 indexing.)</s>
<|assistant|>
<think>
Okay, I will compute the 50th Fibonacci number with a simple loop, then return the
result.

<code>
def fib(n):
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a

fib(50)
</code>

<output>
12586269025
</output>
</think>
<answer>
The 50th Fibonacci number is 12 586 269 025.
</answer>
```

底层实际发生的事情是：语言模型将工具的输入与输出，和标准的自回归（autoregressive）生成词元交错在一起。使这一切成为可能的编排循环（orchestration loop）看起来大致如下：

```
messages = [...]
while True:
    response = model(messages, tools=tools)
    if not response.tool_calls:
        return response.text

    for call in response.tool_calls:
        result = execute_tool(call.name, call.args)
        messages.append({"role": "tool", "tool_call_id": call.id, "content": result})
```

![图](../webapp/assets/figures/fig-p163-1.png)

*图 39：工具使用将模型生成与外部执行交错进行：模型持续生成词元，直到它发出一个工具调用（橘色），外部系统执行该工具并将输出（紫色）注入序列，然后模型继续生成。模型可以在单次生成中发出多个工具调用。在训练时，工具调用与输出的词元通常会从损失函数中被遮蔽（masked）。*

工具使用的训练，重点在于让模型能在这种不同的词元流之下表现得可预测——知道何时该发出工具调用、如何正确格式化参数，以及如何将结果纳入其回应之中。开放模型必须被训练成能与用户可能随插即用的各式工具搭配运作。

## 13.3 多步骤工具推理（Multistep Tool Reasoning）

OpenAI 的 o3 模型代表了多步骤工具使用与语言模型集成方式的一次重大跃进。这种行为与社群中更早期的研究趋势息息相关。例如，ReAct [341] 展示了如何将动作与推理交错融入单一的模型生成之中：

> 在本论文中，我们探索使用大型语言模型以交错方式同时生成推理轨迹（reasoning traces）与任务特定的动作，使两者之间产生更大的综效：推理轨迹帮助模型归纳、追踪与更新行动计划并处理例外状况，而动作则让它得以介接外部来源（例如知识库或环境）并搜集额外信息。

随着工具使用能力的定型与推理模型的起飞，多轮（multi-turn）工具使用已成长为一个令人兴奋的研究领域 [185]。以 RL 训练这些多步骤行为，相较于逐样本（per-sample）的 RLHF 循环，更像是传统的强化学习：代理会与环境及其工具互动完整个轨迹（trajectory），之后才会获得任何奖励，如图 40 所示。

![图](../webapp/assets/figures/fig-p164-1.png)

*图 40：多步骤工具使用的强化学习。从训练数据中抽取一个提示，代理（策略 $\pi_\theta$）沿着一条轨迹与环境及其工具互动，交替执行动作 $a_t$ 与接收观测 $o_t$。完成的轨迹在最后被评分或验证，产生单一的奖励 $r_T$，用以驱动策略更新。与逐样本的 RLHF 循环不同，奖励仅在多步骤推演（rollout）结束后才出现——更接近传统 RL。*

## 13.4 模型上下文协定（Model Context Protocol, MCP）

模型上下文协定（Model Context Protocol, MCP）是一个开放标准，用于将语言模型连接到外部数据源与信息系统 [335]。在数据层，MCP 使用 JSON-RPC 2.0，并为其基本组件（primitives）提供探索（discovery）与执行（execution）方法。MCP 不要求针对每个外部系统采用特定的工具调用格式，而是让模型能透过一个标准化协定访问丰富的上下文信息。

MCP 是在本章工具使用内容之上的一个简单延伸——它是应用程序以可预测的 JSON 结构描述，将上下文（数据 + 动作）传递给语言模型的方式。模型互动的 MCP 服务器具有几个核心基本组件：资源（resources，唯读的数据区块）、提示（prompts，模板化的消息／工作流程），以及工具（tools，模型可调用的函数）。据此，MCP 架构可以概括为：

- MCP 服务器（server）包装一个特定的数据源或能力。
- MCP 用户端（client，例如 Claude Desktop、IDE 插件）聚合一个或多个服务器。
- 主机（host，例如 Claude 或 ChatGPT 应用程序）提供用户／LLM 接口；更换模型供应商或后端工具，只需要替换中间的用户端。

MCP 让工具使用模型的开发者能够使用同一套基础设施，将他们的服务器或用户端接上不同的模型；同时，模型也拥有一个可预测的格式，可用来集成外部组件。这些因素加在一起，为真实世界领域中的工具使用模型打造出一个可预测得多的开发环境。

MCP 服务器透过一个标准化的 JSON 结构描述向用户端公开工具：

```
{
  "name": "get_weather",
  "description": "Get current weather for a location",
  "inputSchema": {
    "type": "object",
    "properties": {
      "location": {
        "type": "string",
        "description": "City name or coordinates"
      }
    },
    "required": ["location"]
  }
}
```

实现这个工具的一个最小 Python MCP 服务器如下：

```
from mcp.server import Server
from mcp.types import Tool, TextContent

server = Server("weather-server")

@server.list_tools()
async def list_tools():
    return [Tool(
        name="get_weather",
        description="Get current weather",
        inputSchema={
            "type": "object",
            "properties": {"location": {"type": "string"}},
            "required": ["location"]
        }
    )]

@server.call_tool()
async def call_tool(name: str, arguments: dict):
    if name == "get_weather":
        weather = fetch_weather(arguments["location"])
        return [TextContent(type="text", text=weather)]
```

## 13.5 实现细节（Implementation Details）

实现工具使用模型时，有多项关于格式化与遮蔽（masking）的决策：

- **Python 与 JSON 格式之别（Python vs. JSON formatting）**：在本章中，我们同时收录了以 JSON 数据结构与以 Python 代码格式化工具使用的范例。模型通常会倾向选定一种结构，而业界不同供应商则各自使用不同的格式。
- **遮蔽工具输出（Masking tool outputs）**：训练工具使用模型时的一个重要细节是，工具输出中的词元会从模型的训练损失中被遮蔽。这确保模型不会去学习预测「处理工具调用的系统」所产生的输出（因为这些结果并不是模型生成的词元）。
- **工具调用的多轮格式化（Multi-turn formatting for tool invocations）**：实现工具调用模型时，常见的做法是为数据加载格式加入更多结构。后训练数据集的标准做法，是一个由用户与助手（且通常还有一则系统消息）交替组成的消息列表。工具使用的整体结构相同，但模型的轮次（turn）会依照每次工具调用，被切分成多个内容子区段。范例如下。

```
messages = [
{
"content": "You are a function calling AI model. You are provided with function
signatures within <functions></functions> XML tags. You may call one or more functions
to assist with the user query. Don't make assumptions about what values to plug into
functions.",
"function_calls": null,
"functions": "[{\"name\": \"live_giveaways_by_type\", \"description\": \"Retrieve live
giveaways from the GamerPower API based on the specified type.\", \"parameters\":
{\"type\": {\"description\": \"The type of giveaways to retrieve (e.g., game, loot,
beta).\", \"type\": \"str\", \"default\": \"game\"}}}]",
"role": "system"
},
{
"content": "Where can I find live giveaways for beta access and games?",
"function_calls": null,
"functions": null,
"role": "user"
},
{
"content": null,
"function_calls":
"live_giveaways_by_type(type='beta')\nlive_giveaways_by_type(type='game')",
"functions": null,
"role": "assistant"
}
]
```

- **词元化与消息格式细节（Tokenization and message format details）**：OpenAI messages 格式中的工具调用，通常会经过聊天模板（chat template，即控制送入模型的消息格式的代码）进行词元化，将结构化的 JSON 表示转换为原始的词元流。这个过程因模型架构而异——有些使用特殊词元来标定工具调用的边界，有些则在词元流本身之中维持结构化的格式。聊天模板游乐场（chat template playgrounds）提供了交互式环境，可用来探索不同模型如何将消息格式转换成词元流。
- **推理词元的连续性（Reasoning token continuity）**：随着推理模型的兴起——它们在给出答案前有一段独立的「推理」词元流——在循环中搭配工具使用时，这些词元的处理方式存在不同的实现。有些模型会在单一轮次内的多次工具调用步骤之间保留推理词元，在多次工具调用之间维持上下文。然而，这些词元在轮次之间通常会被清除，以降低服务成本（但并非总是如此——这是一项设计决策）。
- **各家供应商的 API 格式（API formatting across providers）**（截至 2026 年 5 月）：不同供应商使用概念上相似但技术上有所差异的格式。OpenAI 的 Chat Completions API 使用带有唯一 ID 的 `tool_calls` 数组，而较新的 Responses API 则以 `function_call` 项目表示调用，并以 `call_id` 为键、透过 `function_call_output` 项目返回结果。Anthropic 以 `input_schema` 定义工具，并以 `tool_use` 与 `tool_result` 内容区块（content blocks）表示调用与结果。Gemini 提供函数调用模式，例如 `AUTO`、`ANY`、`NONE`，以及在支持的 Gemini 与 Vertex AI 组态中的 `VALIDATED`。
- **结构描述遵循与约束解码（Schema conformance and constrained decoding）**：生产系统通常使用约束解码（constrained decoding）或「严格模式」（strict mode）选项来强制输出有效的 JSON 与正确的参数类型，减少因格式错误输出而导致的重试。一些封闭模型供应商会额外进行专门的后训练，让结构化 JSON 输出更可靠；而对开放模型而言，这通常是在 vLLM 等系统中以推论阶段的旗标（inference flag）来处理。
- **工具输出的上下文消耗（Tool output context consumption）**：工具输出可能迅速消耗模型的上下文窗口（context window），特别是会返回大量结果的搜索或检索工具。系统必须决定如何对工具输出进行截断、摘要或分页，以在保留模型后续所需信息的同时，让上下文维持在可控范围内。

把这些连回后训练：工具使用的训练数据从何而来？又采用什么目标函数？由人类撰写的工具轨迹收集成本高昂，因此大多数现代工具使用语料都是合成或自举（bootstrapped）而来——如 Toolformer 式的自我标注 [333]，或如 ToolBench 中的大规模生成 [340]。就训练目标而言，在工具轨迹上进行监督式微调（supervised fine-tuning, SFT）能教会模型基本的格式化与工具选择。这能自举出该行为，通常也足以奠定这项技能的基础。对轨迹进行偏好优化（preference optimization，例如 DPO）可以改善「何时该调用工具、何时该直接回答」的决策。对于具有多步骤工具使用的代理式（agentic）任务，带有环境反馈（任务成功、约束满足）的 RL 成为自然的目标函数——模型从「其工具增强的行动是否真正解决了问题」之中学习。
