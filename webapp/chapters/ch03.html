# 第 3 章　训练总览（Training Overview）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 21–30 页。

本章先对 RLHF 训练提供一个概略的总览，本书稍后才会进入各项细节。RLHF 虽然优化的是一个简单的损失函数（loss function），却需要依序训练多个不同的 AI 模型，再将它们串连成一个复杂的在线（online）优化流程。

在这里，我们会介绍 RLHF 的核心目标：在以距离为基础的正则化项（distance-based regularizer）约束下，优化一个代表人类偏好的代理奖励（proxy reward）（同时说明它与古典 RL 问题的关联）。接着我们会展示几个使用 RLHF 打造顶尖模型的经典训练配方（canonical recipes），说明 RLHF 如何与其余的后训练（post-training）方法相互配合。这些范例配方将作为本书后续章节的参照——届时我们会描述进行 RLHF 时可以做的各种优化选择，并回头指出不同的关键模型在训练中如何采用了不同的步骤。

## 3.1 问题形式化（Problem Formulation）

基于人类反馈的强化学习（Reinforcement Learning from Human Feedback, RLHF）的优化建构在标准 RL 设定之上。在 RL 中，智能体（agent）根据环境状态 $s_t$，从策略（policy）$\pi(a_t \mid s_t)$ 中采样动作 $a_t$，以最大化奖励 $r(s_t, a_t)$ [54]。策略是一个将每个状态映射到动作概率分布的函数。演变为现代 RLHF 文献的早期策略属于所谓的深度强化学习（deep reinforcement learning）——即使用神经网络来学习上述函数。传统上，环境依照转移（transition，即动态 dynamics）$p(s_{t+1} \mid s_t, a_t)$ 演化，并具有初始状态分布 $\rho_0(s_0)$。策略与动态共同诱导出一个轨迹分布（trajectory distribution）。一条轨迹的整体概率，是初始状态概率、策略所做的每一次动作选择、以及环境所产生的每一次状态转移的乘积：

$$p_\pi(\tau) = \rho_0(s_0) \prod_{t=0}^{T-1} \pi(a_t \mid s_t)\, p(s_{t+1} \mid s_t, a_t). \tag{1}$$

在一个时间视野（horizon）为 $T$ 的有限回合（episode）中，RL 智能体的目标是求解下列优化问题，其中 $\gamma$ 是介于 0 到 1 之间的折扣因子（discount factor），用以权衡近期与未来奖励之间的相对重要性：

$$\max_\pi \; \mathbb{E}_{\tau \sim p_\pi}\left[\sum_{t=0}^{T-1} \gamma^t\, r(s_t, a_t)\right]. \tag{2}$$

给定策略的期望报酬（expected return）通常记为 $J(\pi)$，最佳值写作 $J^\star = \max_\pi J(\pi)$。

对于持续性任务（continuing tasks），通常令 $T \to \infty$，并依靠折扣（$\gamma < 1$）来确保目标函数是良好定义的。第 6 章将讨论优化此式的多种方法。

### 3.1.1 简单范例：温控器（A Simple Example: The Thermostat）

为了对 RL 的运作建立基本直觉，请想像一个温控器（thermostat），试图将房间维持在华氏 70 度（70°F）的目标温度。在 RL 中，智能体一开始对任务一无所知，必须透过试误（trial and error）来找出好的策略。温控器范例包含以下组成要素（各要素如何对应到式 (1) 的轨迹分布，请见图 5）：

- **状态（State，$s_t$）**：目前的室温，例如 65°F。
- **动作（Action，$a_t$）**：将暖气打开或关闭。
- **奖励（Reward，$r$）**：当温度落在目标的 2 度以内时为 +1，否则为 0。
- **策略（Policy，$\pi$）**：根据目前温度决定要打开或关闭暖气的规则。以下是温控器可能学到的一种策略；视环境确切的转移动态而定，它不一定是最佳的：

$$\pi(a_t = \text{on} \mid s_t) = \begin{cases} 1 & \text{if } s_t < 70^\circ\text{F} \\ 0 & \text{otherwise} \end{cases} \tag{3}$$

- **转移（Transition）**：暖气打开时房间变暖，关闭时则变冷。智能体透过其动作影响这些动态，但底层的物理——房间升温或降温的速度——不在它的控制范围内。

![图](../webapp/assets/figures/fig-p022-2.png)

*图 5：轨迹分布（式 (1)）中的每一项对应到温控器 RL 范例。*

一开始，温控器的策略基本上是随机的——它不管目前温度如何，随意地开开关关暖气，室温因此剧烈波动。经过许多回合的试误之后，智能体发现「房间冷时开暖气、暖时关暖气」能带来更多奖励，并逐渐收敛到一个合理的策略。这就是 RL 的核心循环：观察状态、选择动作、获得奖励，并更新策略以随时间取得更多奖励。

### 3.1.2 经典 RL 范例：CartPole（Classic RL Example: CartPole）

若要看一个具有连续动态、更丰富的例子，可以考虑经典的 *CartPole*（倒立摆，inverted pendulum）控制任务，它出现在许多 RL 教科书、课程、甚至研究论文之中。温控器只有单一状态变量与二元动作，而 CartPole 则涉及四个连续状态变量以及基于物理的转移——使其成为 RL 算法的标准基准测试（benchmark）。

![图](../webapp/assets/figures/fig-p023-1.png)

*图 6：CartPole 环境，显示状态变量 $(x,\ \dot{x},\ \theta,\ \dot{\theta})$ 与动作 $(\pm F)$。*

- **状态（State，$s_t$）**：台车的位置／速度与摆杆的角度／角速度：

$$s_t = (x_t,\ \dot{x}_t,\ \theta_t,\ \dot{\theta}_t). \tag{4}$$

- **动作（Action，$a_t$）**：对台车施加向左或向右的水平力，例如 $a_t \in \{-F, +F\}$。
- **奖励（Reward，$r$）**：一种简单的奖励是：只要摆杆保持平衡且台车停留在轨道上（例如 $|x_t| \le 2.4$ 且 $|\theta_t| \le 12^\circ$），每一步 $r_t = 1$；一旦任一界限被违反，回合即终止。
- **动态／转移（Dynamics / transition，$p(s_{t+1} \mid s_t, a_t)$）**：在许多环境中，动态是确定性的（因此 $p$ 是一个点质量分布 point mass），可透过步长为 $\Delta t$ 的欧拉积分（Euler integration）写成 $s_{t+1} = f(s_t, a_t)$。标准的简化 CartPole 更新使用以下常数：台车质量 $m_c$、摆杆质量 $m_p$、摆杆半长 $l$、重力 $g$（$\alpha$ 是具有加速度单位、经质量归一化的中间量）：

$$\alpha = \frac{a_t + m_p l\, \dot{\theta}_t^2 \sin\theta_t}{m_c + m_p} \tag{5}$$

$$\ddot{\theta}_t = \frac{g\sin\theta_t - \cos\theta_t\, \alpha}{l\left(\frac{4}{3} - \frac{m_p \cos^2\theta_t}{m_c + m_p}\right)} \tag{6}$$

$$\ddot{x}_t = \alpha - \frac{m_p l\, \ddot{\theta}_t \cos\theta_t}{m_c + m_p} \tag{7}$$

$$x_{t+1} = x_t + \Delta t\, \dot{x}_t, \quad \dot{x}_{t+1} = \dot{x}_t + \Delta t\, \ddot{x}_t, \tag{8}$$

$$\theta_{t+1} = \theta_t + \Delta t\, \dot{\theta}_t, \quad \dot{\theta}_{t+1} = \dot{\theta}_t + \Delta t\, \ddot{\theta}_t. \tag{9}$$

这是上述一般设定的具体实例：策略选择 $a_t$，转移函数推进状态，而奖励则在整个回合中累积。

### 3.1.3 调整标准 RL 设定（Manipulating the Standard RL Setup）

RLHF 所用的 RL 形式化被视为一个较不开放的问题：其中 RL 的几个关键组件被设为特定的定义，以配合语言模型。从标准 RL 设定到 RLHF 设定有多项核心变更：表 1 总结了标准 RL 与语言模型所用 RLHF 设定之间的这些差异。

1. **从奖励函数换成奖励模型（Switching from a reward function to a reward model）。** 在 RLHF 中，使用的是一个学习而来的人类偏好模型（learned model of human preferences）$r_\theta(s_t, a_t)$（或任何其他分类模型），而不是环境的奖励函数。这让设计者在方法的弹性与对最终结果的掌控上大幅提升，但代价是实现的复杂度。在标准 RL 中，奖励被视为环境的一个静态组成部分，设计学习智能体的人无法更改或操纵它。
2. **不存在状态转移（No state transitions exist）。** 在 RLHF 中，该领域的初始状态是从训练数据集中采样的提示词（prompt），而「动作」则是对该提示词的补全（completion）（在标准 RLHF 设定中，提示词是固定的，模型的补全并不会决定下一个提示词）。一个提示词加上一个补全便构成一个完整的回合（episode）或 rollout；而在古典 RL 问题中，这会是许多反复的状态—动作、状态—动作链。
3. **回应层级的奖励且不做折扣（Response-level rewards and no discounting）。** RLHF 的奖励归因是针对整个动作序列——由多个生成的 token 组成——一次性完成，而不是以细粒度的方式进行（这种单步结构在 RL 文献中有时称为拉霸机问题（bandit problem））。为了让 RLHF 的 RL 算法把每个 token 视为同一个动作的一部分，实现上通常使用 $\gamma = 1$ 的折扣因子（即不折扣）；这与标准 RL 不同——标准 RL 以 $\gamma < 1$ 在许多连续决策之间权衡短期与长期奖励。

表 1：标准 RL 与语言模型 RLHF 的关键差异。

| 面向 | 标准 RL | RLHF（语言模型） |
|---|---|---|
| 策略 | 从零开始学习（随机初始化） | 从预训练语言模型微调而来 |
| 奖励信号 | 环境奖励函数 $r(s_t, a_t)$ | 学习而来的奖励／偏好模型 $r_\theta(x, y)$（提示词 $x$、补全 $y$） |
| 状态转移 | 有：动态 $p(s_{t+1} \mid s_t, a_t)$ | 通常没有：提示词 $x$ 从数据集中采样；补全不会决定下一个提示词 |
| 动作 | 单一环境动作 $a_t$ | 从 $\pi_\theta(\cdot \mid x)$ 采样的一个补全 $y$（token 序列） |
| 奖励粒度 | 通常逐步／细粒度 | 通常为针对整个补全的回应层级（拉霸机式），通常不折扣（$\gamma = 1$） |
| 时间视野 | 多步回合（$T > 1$） | 通常为单步（$T = 1$），但多轮对话可建模为较长视野 |

鉴于此问题的单轮（single-turn）性质，优化可以改写为不含时间视野与折扣因子（并使用显式的奖励模型）的形式：

$$\max_\pi \; \mathbb{E}_{\tau \sim \pi}\left[r_\theta(s_t, a_t)\right]. \tag{10}$$

就许多方面而言，结果是：尽管 RLHF 深受 RL 优化器与问题形式化的启发，其实际实现与传统 RL 却大不相同。

### 3.1.4 微调与正则化（Fine-Tuning and Regularization）

在传统 RL 问题中，智能体必须从随机初始化的策略开始学习；但在 RLHF 中，我们是从一个具备许多初始能力的强大预训练基础模型出发。RLHF 的这种强先验（prior）带来一项需求：必须防止优化偏离初始策略太远。为了在微调（fine-tuning）情境中取得成功，RLHF 技术采用多种类型的正则化（regularization）来控制优化过程。目标是让奖励最大化仍能发生，同时避免模型陷入过度优化（over-optimization），详见第 14 章的讨论。对优化函数最常见的修改，是在目前 RLHF 策略与优化起点之间的距离上，加入 KL 散度（KL divergence）惩罚项。训练模型时所设定的超参数 $\beta$ 控制此约束的强度——较大的 $\beta$ 让模型更贴近其起点，而较小的 $\beta$ 则给予优化器更多追逐奖励的自由：

![图](../webapp/assets/figures/fig-p026-1.png)

*图 7：标准 RLHF 循环*

$$\max_\pi \; \mathbb{E}_{\tau \sim \pi}\left[r_\theta(s_t, a_t)\right] - \beta\, \mathcal{D}_{\mathrm{KL}}\big(\pi(\cdot \mid s_t)\,\|\,\pi_{\mathrm{ref}}(\cdot \mid s_t)\big). \tag{11}$$

在此形式化之下，许多针对 RLHF 训练的研究，都聚焦于理解如何运用一定的「KL 预算」（KL budget）——以与初始模型的距离来衡量。更多细节请见第 15 章〈正则化〉。

### 3.1.5 优化工具（Optimization Tools）

本书将详细介绍许多用于求解此优化问题的常见技术。后训练的常用工具包括：

- **奖励建模（Reward modeling，第 5 章）**：训练一个模型来捕捉所搜集的偏好数据中的信号，之后便能输出一个标量奖励，用以指示未来文字的质量。
- **指令微调（Instruction fine-tuning，第 4 章）**：RLHF 的先决条件。模型透过模仿预先挑选的范例，学会当今大多数语言模型互动所使用的问答格式。
- **拒绝采样（Rejection sampling，第 9 章）**：最基本的 RLHF 技术。由一个模仿人类偏好的奖励模型，来筛选用于指令微调的候选补全。
- **策略梯度（Policy gradients，第 6 章）**：RLHF 开创性研究范例中所使用的强化学习算法，用来根据奖励模型的信号更新语言模型的参数。
- **直接对齐算法（Direct alignment algorithms，第 8 章）**：直接从成对偏好数据优化策略的算法，而不是先学习一个中介的奖励模型、之后再对其进行优化。

现代以 RLHF 训练的模型一律先采用指令微调，接着混合使用其他的优化选项。

### 3.1.6 RL 在语言模型后训练中的微妙优势（Subtle Advantages of RL in Post-Training Language Models）

在接下来的章节中，我们会介绍许多后训练的优化工具。其中不少——例如拒绝采样（第 9 章）以及像 DPO 这类直接对齐算法（第 8 章）——远比让 RL 顺利运作来得简单。尽管替代方案如此简单，基于 RL 的方法仍持续胜出。有些趋势十分明显，例如搭配可验证奖励的强化学习（reinforcement learning with verifiable rewards, RLVR）所带来的推论时扩展（inference-time scaling）；但事实证明，RL 是非常适合语言模型的优化工具。相较于指令微调或 DPO 类算法，实现 RL 需要大得多的基础设施投资；不过，容我用比较口语的说法：它所提供的梯度更新「通常对模型帮助很大」。这很难量化，但会反复以下列几种形式出现：

- RL 阶段可以「修补」模型的粗糙之处，让模型更容易对话或更稳健（这可能来自于使用 vLLM 之类的推论工具进行训练，使其具备数值稳定性）。确切原因在文献中尚未广为人知，但其真实性反映在 RL 如今日益普及的事实上。
- RL 可以「外科手术式」地进行——模型很擅长学习提示词分布落在何处，而且 RL 倾向于不会「压扁」模型的一般能力。一个好例子是 Tülu 3 仅在数学提示词上以 RL 训练，却能在广泛的任务组合上维持能力 [6]。

整体而言，语言模型上的 RL 损失函数稳健、可扩展、有效且灵活，打开了大片新的实验领域。而最初带领我们走上这条路的方法，正是 RLHF 的研究工作。

## 3.2 经典训练配方（Canonical Training Recipes）

随着时间推移，各种模型被视为 RLHF（或更广义的后训练）的经典配方。这些配方反映了当时的数据实践与模型能力。随着配方逐渐过时，训练出具有相同特性的模型会变得更容易、所需的数据也更少。整体趋势是：后训练涉及愈来愈多的优化步骤、使用愈来愈多的训练算法，并涵盖愈来愈多样的训练数据集与评估。

### 3.2.1 InstructGPT

在 ChatGPT 刚问世前后，广为接受的（「经典」）语言模型后训练方法有三大步骤，其中 RLHF 是核心 [55] [3] [5]。这三个步骤建立在「基础」（base）语言模型（即在大规模网络文字上训练的下一个 token 预测模型）之上，总结如下并见图 8：

1. **在约 1 万笔范例上进行指令微调（Instruction tuning on ~10K examples）**：这让模型学会遵循问答格式，并主要从人工撰写的数据中学到一些基本技能。
2. **在约 10 万笔成对提示词上训练奖励模型（Training a reward model on ~100K pairwise prompts）**（论文使用 33K 笔提示词）：此模型从指令微调后的检查点（checkpoint）训练而来，捕捉人们希望在最终训练中建模的多元价值。奖励模型是 RLHF 的优化目标。
3. **在另外约 10 万笔提示词上，以 RLHF 训练指令微调后的模型（Training the instruction-tuned model with RLHF on a separate ~100K prompts）**（论文确切使用 31K 笔，且未记载提示词是否重复使用自其他阶段）：模型以奖励模型为目标进行优化，使用的很可能是另外一组提示词；模型先对其生成回应，之后再获得评分。

RLHF 完成后，模型便准备好部署给用户。这个配方是现代 RLHF 的基石，但如今的配方已大幅演进，包含更多阶段与更多数据。

![图](../webapp/assets/figures/fig-p028-1.png)

*图 8：早期三阶段 RLHF 流程的示意图：SFT、奖励模型、然后进行优化。*

### 3.2.2 Tülu 3

现代版本的后训练涉及多得多的模型版本与训练阶段（也就是远超过 Llama 2 所记载的 5 个 RLHF 步骤 [49]）。下方图 9 展示了一个例子：模型在收敛之前经历多次训练迭代。

![图](../webapp/assets/figures/fig-p028-2.png)

*图 9：现代多轮后训练流程的示意图。*

这个时代及其后所训练的最复杂模型，并未公开其训练流程的完整细节。到了 2026 年，ChatGPT 或 Claude 等领先模型都涉及多轮迭代训练。这甚至可能包括先训练多个专门模型、再将权重合并（merge）在一起，以得到能胜任多种子任务的最终模型的技术 [56]（例如 Cohere 的 Command A [57]）。

![图](../webapp/assets/figures/fig-p029-1.png)

*图 10：Tülu 3 配方的摘要，包含目标技能与多步骤训练配方。Lambert et al. 2024，授权 CC-BY。*

Tülu 3 是这种多阶段后训练方法中一个完全开放、且 RLHF 扮演要角的例子。Tülu 3 配方由三个阶段组成：

1. **在约 100 万笔范例上进行指令微调（Instruction tuning on ~1M examples）**：这个以合成数据为主的数据集，取自 GPT-4o 与 Llama 3.1 405B 等前沿模型的混合输出，教导模型一般性的指令遵循，并作为数学与程序撰写等能力的基础。
2. **在约 100 万组偏好对上使用 on-policy 偏好数据（On-policy preference data on ~1M preference pairs）**：此阶段大幅提升模型的对话能力（chattiness）（例如 Arena（前身为 ChatBotArena）或 AlpacaEval 2 的表现），同时也改善前述指令微调阶段中提到的技能。
3. **在约 1 万笔提示词上进行可验证奖励的强化学习（Reinforcement Learning with Verifiable Rewards on ~10K prompts）**：此阶段是一次小规模的强化学习训练，用来提升数学等核心技能，同时维持整体性能（如今被视为 DeepSeek R1 等现代推理模型的先声）。

这个配方已成功应用于 Llama 3.1 [6]、OLMo 2 [58] 与 SmolLM 系列模型 [59]。

### 3.2.3 DeepSeek R1

随着推理语言模型（reasoning language models）——例如 OpenAI 的 o1——的兴起，后训练的最佳实践再次演进，重新排序并重新分配各训练阶段之间的计算资源。推理模型后训练配方中记载最清楚的是 DeepSeek R1 [15]；阿里巴巴较大的 Qwen 3 模型（即仅 32B 与 225B MoE 模型）[60]，或小米的 MiMo 7B [61]，也仿效了此做法。DeepSeek 配方如下：

1. **以 10 万笔以上的 on-policy 推理样本进行「冷启动」（"Cold-start" with 100K+ on-policy reasoning samples）**：这些数据采样自较早的 RL 检查点 R1-Zero，并经过大量过滤，用以在 DeepSeek-V3-Base 上灌注特定的推理过程。DeepSeek 使用「冷启动」一词来描述 RL 如何从少量监督数据中学习。
2. **大规模强化学习训练（Large-scale reinforcement learning training）**：此阶段让模型反复处理推理问题，在多种基准测试上执行 RLVR「直到收敛」。
3. **拒绝采样与 SFT（Rejection sampling and SFT）**：接近收敛时，他们对 RL 检查点套用拒绝采样，建立一个约 80 万笔样本的 SFT 数据集，然后在大约 3/4 推理问题与 1/4 一般查询的过滤混合数据上微调模型，以产生一个通用模型。
4. **混合式强化学习训练（Mixed reinforcement learning training）**：在推理问题（可验证奖励）上，搭配一般偏好调校的奖励模型，对模型做最后的打磨。

如同前文，这个配方也存在各种演进，特别是在步骤 3 与 4——即在将模型开放给用户之前完成最终定稿的阶段。许多模型一开始就使用量身打造的指令数据集，其中包含从既有模型大量过滤与打磨而来的思维链（chain-of-thought）序列，让模型只靠 SFT 就能快速达到强大的行为表现，之后才进入 RL 阶段 [62]。
