# 附录 C　实践议题（Practical Issues）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 236–238 页。

本附录涵盖大规模执行后训练（post-training）实验时的实践考量。内容采取经验教训清单的形式，而非一篇连贯的叙事。

## C.1 后训练的计算成本（Compute Costs of Post-Training）

估算后训练执行成本有两种不同的角度。最大的成本在于开发配方（recipe），其计算量很容易达到最终几次训练执行的 10 倍到 100 倍。次要成本则较容易衡量，指的是彻底落实一套配方的成本，包括跑多组随机种子（seed）、仔细的评估、可能遭遇的工程麻烦等等。

就第一种成本而言，为了开发像 Tülu 3 [6] 这样的后训练配方，团队在得到最终模型之前，在 7B 规模上执行了数以千计的实验与评估。

至于最终的训练执行，Olmo 3 的报告对训练最终 32B Think 模型所涉及的工作有详细的记述 [18]：

> 后训练遵循一种不同的作业模式：我们会将每个阶段执行多次，扫描（sweep）学习率（learning rate）与其他超参数（hyperparameters）。后训练——尤其是强化学习（RL）——的理论尚不成熟，因此我们必须执行多次实验，才能为给定的基础模型找出最佳超参数。我们希望在未来的工作中解决这个问题。
>
> 在后训练期间，检查点（checkpoint）评估消耗了较大比例的计算资源，部分原因是推理模型（reasoning models）在核心基准测试（benchmark）上会产生很长的生成内容。在监督式微调（SFT）方面，我们扫描了四个候选学习率，每个都使用 256 颗 GPU，平行执行 36 小时。接着大约花了 12 小时进行评估、合并与检查点确认，总计约两天。直接偏好优化（DPO）训练每次执行所需时间较短（每项任务在 64 颗 GPU 上完成完整学习率扫描约需 18 小时），但实际应用中因集群不稳定而延长到好几天。初版 Olmo 3 Think 32B 的最终 RL 训练执行历时约 5 天，其中至少有一天的训练时间因稳定性问题而损失。在 Olmo 3 首次发布之后，我们将表现最佳的 RL 训练在 224 颗 GPU 上又持续执行了 21 天，产出 Olmo 3.1 Think 32B。

随着扩展强化学习规模逐渐成为更标准的做法，这种情况将再次改变 [17]。延续上面的例子：原本 Olmo 3 32B Think 的后训练只花了几周，但为了发布改进版的 Olmo 3.1 32B Think 模型，团队需要以可验证奖励的强化学习（RLVR, Reinforcement Learning with Verifiable Rewards）额外训练 3.5 周。这在*时间*上是相当可观的成本，更甚于总计算量。

## C.2 评估方差（Evaluation Variance）

后训练中一项被低估的挑战是评估方差（evaluation variance），尤其随着推理模型的兴起——这类模型需要使用温度（temperature）大于 0 的采样才能取得最佳评估分数。只要对模型进行任何形式的采样，输出就会变得更不稳定。不同基准测试的稳定性特性差异极大，原因包括提示（prompt）难度的变异、评估集中提示的数量、受训模型本身的脆弱程度等等。

在 Olmo 3 的开发期间，团队追踪了用于评估推理模型的各项评估的方差。下表列出各评估的标准差（standard deviation），计算方式为 14 个模型各执行 3 次的标准差平均值（先取每个模型的变异，再对每项评估取平均）：

表 9：评估基准测试在多次推论执行之间的标准差，依稳定性分类（数据来自 Olmo 3）。

| 类别 | 基准测试 | 标准差 |
| --- | --- | --- |
| 高变异（High Variance） | GPQA | 1.48 |
| | AlpacaEval 3 | 1.24 |
| | IFEval | 0.88 |
| 稳定（Stable） | ZebraLogic | 0.56 |
| | Omega | 0.56 |
| | AIME 24（Avg@32） | 0.54 |
| | HumanEvalPlus | 0.46 |
| | AgiEval | 0.43 |
| | BigBenchHard | 0.39 |
| 非常稳定（Very Stable） | LiveCodeBench（Avg@10） | 0.29 |
| | MBPPPlus | 0.27 |
| | MATH | 0.25 |
| | MMLU | 0.22 |
| | PopQA | 0.16 |

某些评估（例如 LiveCodeBench）既有噪声又便宜（因为评估集中的提示数量不多），因此只要对每个模型重复执行该评估 10 次，就能让它从高变异组别移到稳定的区间。这件事对每一项评估都可以做，但成本很容易迅速膨胀。

我们也观察到评估设定中的其他变异来源，例如批次大小（batch size）、vLLM 内的张量平行（tensor parallel）设定（例如基准线采用 TP=2），以及在不同基础设施上采样长篇生成内容时其他敏感的数值因素。对推理模型（reasoners）而言，变异无所不在。

## C.3 管理训练性能变异（Managing Training Performance Variance）

在本书讨论过的所有后训练配方与工具中，最终模型的性能都存在不可忽视的变异。理解这种变异的分布、来源与影响，是打造强大模型的关键。训练最终模型的目标，是透过改变训练参数与随机种子来采样许多个点，以获得可能范围内最强的模型。请注意，这是在「模型*真的*变得更好」与「仅仅是靠评估噪声重抽而占到便宜」之间取得平衡。

前一节聚焦在*评估*噪声，而更棘手的噪声来源是训练的不确定性。评估噪声可以透过对给定检查点执行更多测试来管理（一致地降低噪声），但模型只会被训练一次，因此可以从正向的离群值（outlier）中*受益*。

实际应用中，训练团队会采取许多步骤，以便从训练配方中榨取最大可能的价值：

1. 对每一次最终模型的训练执行，扫描学习率、批次大小等核心优化数值。例如，面对一个新的基础模型，我会建议先在宽广的区间内跑 10 个学习率，确定自己落在最佳范围内，然后再于更窄的最佳窗口内重新执行。
2. 在表现最好的几组设定上跑多个随机种子。随机种子可能对最终模型产生实质影响，值得为此投入计算资源。
3. 模型合并（model merging）已确立为打造强大模型的关键工具。合并有很多种做法，从合并同一份数据上训练的不同检查点，到合并针对特定领域的专门模型都有。整体而言，合并被视为最终配方中强大而简单的工具，但对于如何在配方中预先准备一个模型以供后续合并，尚未建立明确的最佳实践 [409]。

## C.4 辨识异常的训练任务（Identifying Bad Training Jobs）

训练模型时，有一个重要且必须建立的简单直觉：模型问题有不同的类型。你希望把大部分时间花在「目前的数据、算法或配方就是不够好」这类问题上。另一方面，在构建新配方的过程中，也有很多时候某些方法根本就是坏掉的。

理解这一点的最佳方式，是在一套大致固定的评估软件包上评估许多模型。如此一来，你会逐渐培养出直觉，知道哪些测试很难被后训练介入手段撼动（通常是知识密集型的评估，例如 MMLU）。当后训练设定中有东西非常、*非常*严重地坏掉时，这些大致稳定的评估在一次训练任务中往往会掉 10 到 20 分。这是开发工具链时最有用的信号之一！
