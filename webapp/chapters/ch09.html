# 第 9 章　拒绝采样（Rejection Sampling）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 117–123 页。

拒绝采样（Rejection Sampling, RS）是偏好微调（preference fine-tuning）中使用最广泛、却也最缺乏文献记载的方法之一。许多重要的 RLHF 论文都将它作为训练管线的核心组成部分，但至今仍不存在一个标准（canonical）的实现，也没有人解释过它为什么如此有效。拒绝采样可以应用在训练管线的多个节点——指令微调之后、基于 RL 的优化之后、甚至 RLVR 之后——这使它成为一个用途广泛但难以归类的工具。加上文献记载不足的特性，这正是它被安排在核心优化方法末尾介绍的原因。

拒绝采样的运作方式是：先搜集新的候选补全（completion），根据一个已训练好的奖励模型（reward model）加以筛选，然后只用其中最好的补全来微调原始模型（使用与指令微调相同的损失函数）。

这个名称源自计算统计学（computational statistics）[209]：当人们想从一个复杂的分布中采样、却没有直接的方法时，可以改从一个较容易建模的分布中采样，并使用一个启发式规则（heuristic）来检查样本是否可以接受。对应到语言模型上，目标分布是「对提示（prompt）的高质量补全」，筛选器是奖励模型，而采样分布则是当前的模型。

WebGPT [4]、Anthropic 的 Helpful and Harmless 智能体 [5]、OpenAI 著名的过程奖励模型（process reward models）论文 [50]、Llama 2 Chat 模型 [49]，以及其他开创性研究，全都使用了这个基准方法；较近期的研究则将它直接形式化——例如将其应用于多模态对齐的 RAFT [210]，以及 Statistical Rejection Sampling Optimization（RSO）[211]，后者从原理层面概述了拒绝采样与其他偏好学习目标之间的关系。

*在本章中，我们一律以 $x$ 表示提示、以 $y$ 表示补全。这种记号在语言模型文献中很常见——这些方法操作的是完整的「提示–补全」对，而非个别 token。*

## 9.1 训练流程逐步解析（Training Process, Step by Step）

拒绝采样整体上遵循几个阶段。

0. **选择提示与奖励模型（Prompt and reward model selection）**：首先，你必须选定要训练的提示集，并考量它与训练其他阶段的相对关系。最简单的方法是重复使用第一个 SFT/IFT 阶段中的所有提示，但这可能造成一定程度的过度拟合（overfitting）。在进行拒绝采样之前，你也必须已经训练好一个奖励模型（详见第 5 章）。
1. **从起始检查点生成补全（Generate completions from the starting checkpoint）**：接着，必须用想要优化的模型，对选定的提示生成补全。这可能涉及调整许多设定，例如采样温度（temperature）、top-p、最大序列长度、每个提示的补全数量等。
2. **用奖励模型选出最佳补全（Select top completions with a reward model）**：所有补全都由奖励模型进行排序。这个阶段也可能包含去重（deduplication），使每个提示只保留一个补全；不过许多这类设计决策最终都取决于实证上的消融实验（ablation studies）。
3. **对最佳补全进行 SFT（SFT on top completions）**：最后一步，是以选出的补全对起始检查点进行指令微调，完成整个拒绝采样流程。

至于实际该使用哪些提示、如何挑选奖励模型、拒绝采样该安排在什么顺序等细节，文献中并没有完善的记载。本章提供这些方法的概述，并把进一步的实验留给读者。

### 9.1.1 生成补全（Generating Completions）

为了对每个提示生成多个候选补全，我们先将 $M$ 个提示的集合定义为一个向量：

$$
X = [x_1, x_2, ..., x_M] \tag{110}
$$

这些提示可以有许多来源，但最常见的是来自指令训练集。

对每个提示 $x_i$，我们生成 $N$ 个补全。我们可以把它表示成一个矩阵：

$$
Y = \begin{bmatrix}
y_{1,1} & y_{1,2} & \cdots & y_{1,N} \\
y_{2,1} & y_{2,2} & \cdots & y_{2,N} \\
\vdots & \vdots & \ddots & \vdots \\
y_{M,1} & y_{M,2} & \cdots & y_{M,N}
\end{bmatrix} \tag{111}
$$

其中 $y_{i,j}$ 表示第 $i$ 个提示的第 $j$ 个补全。每一列（row）$i$ 对应单一提示 $x_i$，包含它的 $N$ 个候选补全；每一行（column）$j$ 则对应所有提示中第 $j$ 次采样得到的补全。

### 9.1.2 为补全评分（Scoring Completions）

现在，我们把所有这些「提示–补全」对送进奖励模型，得到一个奖励矩阵。我们把奖励表示成矩阵 $R$：

$$
R = \begin{bmatrix}
r_{1,1} & r_{1,2} & \cdots & r_{1,N} \\
r_{2,1} & r_{2,2} & \cdots & r_{2,N} \\
\vdots & \vdots & \ddots & \vdots \\
r_{M,1} & r_{M,2} & \cdots & r_{M,N}
\end{bmatrix} \tag{112}
$$

每个奖励 $r_{i,j}$ 是把补全 $y_{i,j}$ 与其对应的提示 $x_i$ 一起送进奖励模型 $\mathcal{R}$ 计算而得：

$$
r_{i,j} = \mathcal{R}(y_{i,j} \mid x_i) \tag{113}
$$

要选出用于训练的最佳补全，有多种方法。

为了将「根据奖励矩阵选出最佳补全」这个过程形式化，我们可以定义一个作用在奖励矩阵 $R$ 上的选取函数（selection function）$S$。

#### 9.1.2.1 每个提示取最佳（Top Per Prompt）

第一种可能的选取函数，是对每个提示取奖励的最大值。

$$
S(R) = \left[\arg\max_{j} r_{1,j},\ \arg\max_{j} r_{2,j},\ ...,\ \arg\max_{j} r_{M,j}\right] \tag{114}
$$

这个函数 $S$ 返回一个索引向量，其中每个索引对应 $R$ 中每一列奖励最大值所在的行。接着我们就能用这些索引选出我们要的补全：

$$
Y_{chosen} = [y_{1,S(R)_1},\ y_{2,S(R)_2},\ ...,\ y_{M,S(R)_M}] \tag{115}
$$

#### 9.1.2.2 整体最佳配对（Top Overall Pairs）

另一种做法是从整个集合中选出前 $K$ 个「提示–补全」对。首先，我们把奖励矩阵 $R$ 摊平（flatten）成单一向量：

$$
R_{flat} = [r_{1,1}, r_{1,2}, ..., r_{1,N}, r_{2,1}, r_{2,2}, ..., r_{2,N}, ..., r_{M,1}, r_{M,2}, ..., r_{M,N}] \tag{116}
$$

这个 $R_{flat}$ 向量的长度为 $M \times N$，其中 $M$ 是提示的数量，$N$ 是每个提示的补全数量。

现在，我们可以定义一个选取函数 $S_K$，选出 $R_{flat}$ 中 K 个最大值的索引：

$$
S_K(R_{flat}) = \text{argsort}(R_{flat})[-K:] \tag{117}
$$

其中 argsort 返回能将数组以递增顺序排序的索引，而我们取最后 $K$ 个索引，即得到 $K$ 个最大值。

要取得选出的补全，我们需要把这些摊平后的索引映射回原本的补全矩阵 $Y$。要还原对应的「提示–补全」对，可以把从零起算（zero-indexed）的摊平索引 $k$ 映射到 $(i, j)$：$i = \lfloor k/N \rfloor + 1$ 且 $j = (k \bmod N) + 1$。

#### 9.1.2.3 选取范例（Selection Example）

考虑以下情境：我们有五个提示和四个补全。我们将展示两种根据奖励选取补全的方式。

$$
R = \begin{bmatrix}
0.7 & 0.3 & 0.5 & 0.2 \\
0.4 & 0.8 & 0.6 & 0.5 \\
0.9 & 0.3 & 0.4 & 0.7 \\
0.2 & 0.5 & 0.8 & 0.6 \\
0.5 & 0.4 & 0.3 & 0.6
\end{bmatrix} \tag{118}
$$

首先是**每个提示取最佳（per prompt）**。直观上，我们可以将奖励矩阵标示如下：

$$
R = \begin{bmatrix}
\mathbf{0.7} & 0.3 & 0.5 & 0.2 \\
0.4 & \mathbf{0.8} & 0.6 & 0.5 \\
\mathbf{0.9} & 0.3 & 0.4 & 0.7 \\
0.2 & 0.5 & \mathbf{0.8} & 0.6 \\
0.5 & 0.4 & 0.3 & \mathbf{0.6}
\end{bmatrix} \tag{119}
$$

使用 argmax 方法，我们为每个提示选出最佳补全：

$$
S(R) = \left[\arg\max_{j} r_{i,j} \ \text{for} \ i \in [1,5]\right] \tag{120}
$$

$$
S(R) = [1, 2, 1, 3, 4] \tag{121}
$$

这表示我们会选出：

- 提示 1：补全 1（奖励 0.7）
- 提示 2：补全 2（奖励 0.8）
- 提示 3：补全 1（奖励 0.9）
- 提示 4：补全 3（奖励 0.8）
- 提示 5：补全 4（奖励 0.6）

接着是**整体最佳（best overall）**。我们把整体前五名的补全配对标示出来。

$$
R = \begin{bmatrix}
\mathbf{0.7} & 0.3 & 0.5 & 0.2 \\
0.4 & \mathbf{0.8} & 0.6 & 0.5 \\
\mathbf{0.9} & 0.3 & 0.4 & \mathbf{0.7} \\
0.2 & 0.5 & \mathbf{0.8} & 0.6 \\
0.5 & 0.4 & 0.3 & 0.6
\end{bmatrix} \tag{122}
$$

首先，我们把奖励矩阵摊平：

$$
R_{flat} = [0.7, 0.3, 0.5, 0.2, 0.4, 0.8, 0.6, 0.5, 0.9, 0.3, 0.4, 0.7, 0.2, 0.5, 0.8, 0.6, 0.5, 0.4, 0.3, 0.6] \tag{123}
$$

接着，我们选出五个最大值的索引：

$$
S_5(R_{flat}) = [8, 5, 14, 0, 11] \tag{124}
$$

把这些索引映射回原本的矩阵：

- 索引 8 → 提示 3、补全 1（奖励 0.9）
- 索引 5 → 提示 2、补全 2（奖励 0.8）
- 索引 14 → 提示 4、补全 3（奖励 0.8）
- 索引 0 → 提示 1、补全 1（奖励 0.7）
- 索引 11 → 提示 3、补全 4（奖励 0.7）

#### 9.1.2.4 实现范例（Implementation Example）

以下代码片段展示了这些选取方法可以如何实现。

```python
import numpy as np

x = np.random.randint(10, size=10)
print(f"{x=}")
sorted_indices = np.argsort(x)
x_sorted = x[sorted_indices]
print(f"{x_sorted=}")

# first way to recover the original array
i_rev = np.zeros(10, dtype=int)
i_rev[sorted_indices] = np.arange(10)
np.allclose(x, x_sorted[i_rev])

# second way to recover the original array
np.allclose(x, x_sorted[np.argsort(sorted_indices)])
```

### 9.1.3 微调（Fine-Tuning）

有了选出的补全之后，接着就对模型的当前版本执行标准的指令微调。更多细节可参阅指令微调的章节。

## 9.2 实现细节（Implementation Details）

执行这种训练的核心超参数都相当直观：

- **采样参数（Sampling parameters）**：拒绝采样直接取决于从模型取得的补全。拒绝采样的常见设定包括大于零的温度（例如介于 0.7 到 1.0 之间），并搭配对 top-p 或 top-k 采样等参数的其他调整。
- **每个提示的补全数量（Completions per prompt）**：成功的拒绝采样实现，通常对每个提示采 10 到 30 个或更多的补全。补全数量太少会使训练产生偏差（biased）且/或带有噪声（noisy）。
- **指令微调细节（Instruction tuning details）**：关于拒绝采样中指令微调阶段的训练细节，尚未有明确的公开信息。它们很可能使用与最初指令微调阶段略有不同的设定。
- **异质模型生成（Heterogeneous model generations）**：某些拒绝采样的实现，会纳入来自多个模型的生成结果，而不仅仅来自即将被训练的当前模型。这方面的最佳实践尚未确立。
- **奖励模型训练（Reward model training）**：所使用的奖励模型会对最终结果产生重大影响。关于奖励模型训练的更多资源，请参阅相关章节。

在进行批次的奖励模型推论时，可以将 token 化后的补全依长度排序，让每个批次的长度相近。这能免去在大量填充（padding）token 上执行推论的需要，以少量的实现复杂度换取吞吐量的提升。

## 9.3 相关方法：Best-of-N 采样（Related: Best-of-N Sampling）

Best-of-N（BoN）采样是拒绝采样的近亲：它遵循同样「生成并评分」的程序，但你**不**用选出的补全去微调模型。相反地，BoN 是在推论时（inference time）针对一个固定的提示（或一组提示）计算可能的最佳补全；相关技术经常用于聊天模型的「Pro」级服务层——为了回答你的查询而投入额外的计算量。

Best-of-N 采样经常被拿来作为 RLHF 训练方法的比较基准。务必记得，BoN *并不会*修改底层模型，它是一种采样技术。因此，在某些情境下，将 BoN 采样与 PPO 等在线训练方法做比较仍然是有效的。例如，你仍然可以在执行 BoN 采样时，衡量它相对于任何其他策略（policy）的 KL 距离。

在这里，我们将说明：当对单一提示使用简单的 BoN 采样时，前面展示的两种选取准则是等价的。

令 $R$ 为我们单一提示搭配 $N$ 个补全的奖励向量：

$$
R = [r_1, r_2, ..., r_N] \tag{125}
$$

其中 $r_j$ 表示第 j 个补全的奖励。

使用 argmax 方法，我们为该提示选出最佳补全：

$$
S(R) = \arg\max_{j \in [1,N]} r_j \tag{126}
$$

而使用 top-K 方法并取 $K = 1$，就会化约成同一种方法——这是常见的做法。

## 9.4 建议实验（Suggested Experiments）

`code/rejection_sampling/` 中的配套实现会执行一个完整的 GSM8K 拒绝采样管线：生成 rollout、用奖励模型评分、选出训练子集、微调，并以精确匹配（exact-match）准确率进行评估。四个设定档被安排成互相配对的实验组／对照组，让读者可以检验奖励模型是否真的有帮助。

1. **先建立一次 rollout 缓存。**

```
cd code/
uv run python -m rejection_sampling.preprocess \
    --config rejection_sampling/configs/top_per_prompt.yaml
```

这会为共用的 GSM8K 切片生成补全并评分。只要生成与评分的设定保持不变，后续的训练设定档都会重复使用这份缓存。

2. **将奖励选取与随机对照组做比较。**

```
cd code/
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/top_per_prompt.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/random_per_prompt.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/top_k_overall.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/random_k_overall.yaml
```

   以配对的方式解读结果：`top_per_prompt` 对比 `random_per_prompt`，以及 `top_k_overall` 对比 `random_k_overall`。如果由奖励选取的那组跑不赢它的随机基准，就表示奖励模型或采样出的补全在该数据切片上并未提供有用的信号。

3. **调整奖励模型可以挑选的空间大小。** 复制一份设定档，修改 `num_completions_per_prompt`、`temperature`、`top_p` 与 `selection.top_k`。更多的补全可以提高「可得的最佳样本」的质量，但前提是奖励模型有能力区分好答案与坏答案。

4. **尝试较小的策略模型。** 将 `model_name` 设为一个较小的兼容指令模型，降低 `max_train_samples`，然后重新执行同样的配对实验。这能让实验成本更低，并凸显出拒绝采样究竟是在拯救较弱的生成结果，还是只是在一群本来就不错的结果中做挑选。
